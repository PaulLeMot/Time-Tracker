worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 192.168.137.105:8443 ssl;
        server_name operportal.fandocraft.ru;
        ssl_certificate /tls/fullchain.pem;
        ssl_certificate_key /tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:OPNTLS:2m;
        if ($host != "operportal.fandocraft.ru") { return 421; }
        client_max_body_size 0;
        add_header Permissions-Policy "camera=(self)" always;
        location = / {
            absolute_redirect off;
            add_header Cache-Control "no-store" always;
            return 302 /static/employee.html;
        }
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
            proxy_redirect off;
        }
    }
}
