version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: timetracker
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: timetracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://timetracker:secret@db:5432/timetracker
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:
