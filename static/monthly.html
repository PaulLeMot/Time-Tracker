<!-- tabs/monthly.html -->
<div class="monthly-tab-content">
    <div class="date-picker period-toolbar">
        <label>Период:
            <input class="period-date-input" type="text" id="periodDateRange" placeholder="Выберите период">
        </label>
        <button id="loadPeriodReportBtn" class="btn">Показать</button>
        <label class="period-employee-label">Сотрудник:
            <select class="period-employee-select" id="periodEmployeeFilter">
                <option value="">Все</option>
            </select>
        </label>
        <span class="period-traffic-toggle" id="trafficPeriodBtn" title="Переключить режим светофора">🚦</span>
    </div>
    <div id="periodReportContainer">Выберите период и нажмите «Показать»</div>
    <div class="period-traffic-container" id="trafficPeriodContainer"></div>
    <div class="period-notifications-container" id="periodNotificationsContainer">
        <h3>📋 Уведомления сотрудника за период</h3>
        <div id="periodNotificationsList">Загрузка...</div>
    </div>
</div>
