<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Личный кабинет сотрудника</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 24px;
        }
        h1, h2 { color: #0f172a; }
        .info {
            background: #f8fafc;
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }
        .action-btn {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 14px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            text-align: center;
        }
        .action-btn:active { transform: scale(0.98); }
        .action-btn.break { background: #f59e0b; }
        .action-btn.end { background: #ef4444; }
        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            float: right;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #e2e8f0;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0f172a;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show { opacity: 1; }
        @media (max-width: 480px) {
            .container { padding: 16px; }
        }
        /* Стили для вкладок */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: 500;
            color: #64748b;
            cursor: pointer;
            border-radius: 40px;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            background: #f1f5f9;
            color: #1e293b;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
        }
        .tab-content {
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .date-picker {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background: white;
            margin: 20% auto;
            padding: 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
        }
        .modal-content input {
            width: 100%;
            margin: 8px 0;
            padding: 8px;
        }
        .modal-content button {
            margin-top: 12px;
        }
        .close {
            float: right;
            font-size: 24px;
            cursor: pointer;
        }
        #monitorContainer {
            overflow-x: auto;
        }
        #monitorContainer .report-table {
            min-width: 900px;
        }
        @media (max-width: 600px) {
            .tabs {
                overflow-x: auto;
                white-space: nowrap;
                flex-wrap: nowrap;
                -webkit-overflow-scrolling: touch;
                padding-bottom: 4px;
            }
            .tab-btn {
                font-size: 0.85rem;
                padding: 6px 16px;
                flex-shrink: 0;
            }
        }
        .sortable-list {
            list-style: none;
            padding: 0;
            margin: 0 0 8px 0;
            display: flex;
            flex-direction: row;
            gap: 8px;
            background: #f8fafc;
            border-radius: 60px;
            padding: 8px 12px;
            flex-wrap: wrap;
        }
        .sortable-list li {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 6px 16px;
            cursor: grab;
            user-select: none;
            transition: background 0.2s;
            display: inline-block;
        }
        .sortable-list li:active {
            cursor: grabbing;
        }
        .sortable-list li.dragging {
            opacity: 0.5;
        }
        .btn {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-right: 6px;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #2563eb;
        }
        .btn-sm {
            padding: 4px 8px;
            font-size: 0.75rem;
        }
        #monitorContainer .report-table th,
        #monitorContainer .report-table td {
            text-align: center;
        }
        #monitorContainer .report-table th:first-child,
        #monitorContainer .report-table td:first-child,
        #monitorContainer .report-table th:nth-child(5),
        #monitorContainer .report-table td:nth-child(5) {
            text-align: left;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Личный кабинет</h1>
    <div style="display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 16px;">
        <button id="adminPanelBtn" class="logout" style="display: none; background: #3b82f6;">Админ-панель</button>
        <button id="changePasswordBtn" class="logout">Сменить пароль</button>
        <button id="logoutBtn" class="logout">Выйти</button>
    </div>
    

    <!-- Вкладки -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="daily">📅 Сегодня</button>
        <button class="tab-btn" data-tab="weekly">📆 Статистика по неделям</button>
        <button class="tab-btn" data-tab="monitor" id="monitorTab" style="display: none;">📊 Мониторинг</button>
    </div>

    <!-- Содержимое вкладки "Сегодня" -->
    <div id="daily-tab" class="tab-content">
        <div id="employeeName" class="info">Загрузка...</div>
        <div id="statusInfo" class="info">
            <strong>Статус дня:</strong> <span id="statusDay">—</span><br>
            <strong>Статус перерыва:</strong> <span id="statusBreak">—</span><br>
            <strong>Отработано сегодня:</strong> <span id="workedToday">—</span><br>
            <strong>Перерывы сегодня:</strong> <span id="breakToday">—</span><br>
            <strong>Количество перерывов:</strong> <span id="breakCountToday">—</span>
        </div>

        <div id="actionButtons" class="buttons"></div>

        <h2>Мои отметки за сегодня</h2>
        <div id="entriesContainer">Загрузка...</div>
    </div>

    <!-- Содержимое вкладки "Недельная статистика" -->
    <div id="weekly-tab" class="tab-content" style="display: none;">
        <div class="date-picker">
            <input type="week" id="weekPicker">
            <button id="loadWeeklyBtn">Показать</button>
        </div>
        <div id="weeklyContainer">Загрузка...</div>
    </div>

    <div id="monitor-tab" class="tab-content" style="display: none;">
        <div class="date-picker">
            <input type="date" id="monitorDate" value="">
            <button id="refreshMonitorBtn" class="btn btn-sm" style="background: #3b82f6;">Обновить</button>
        </div>
        <div>
            <button id="toggleMonitorFilterBtn" class="btn" style="margin-bottom: 8px;">🎛️ Фильтр по статусам</button>
        </div>
        <div id="monitorStatusOrderSettings" style="margin-bottom: 16px; display: none;">
            <h3>Порядок статусов в отчёте</h3>
            <ul id="monitorStatusOrderList" class="sortable-list">
                <li data-status="working">✅ Работает</li>
                <li data-status="onbreak">☕ В перерыве</li>
                <li data-status="notstarted">❌ Не начал</li>
                <li data-status="ended">🏁 Завершил</li>
            </ul>
            <button id="saveMonitorStatusOrderBtn" class="btn">Сохранить порядок</button>
        </div>
        <div id="monitorContainer">Загрузка...</div>
    </div>

    <div id="changePasswordModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Смена пароля</h3>
            <input type="password" id="oldPassword" placeholder="Старый пароль">
            <input type="password" id="newPassword" placeholder="Новый пароль">
            <input type="password" id="confirmPassword" placeholder="Подтвердите новый пароль">
            <button id="savePasswordBtn" class="action-btn">Сохранить</button>
            <div id="passwordError" style="color:red; margin-top:8px;"></div>
        </div>
    </div>
</div>
<div id="toast" class="toast">

<script>
    // ========== Вспомогательные функции ==========
    function getLocalDate() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function formatDateTime(isoString) {
        if (!isoString) return '—';
        let str = isoString.slice(0, 19).replace('T', ' ');
        const [datePart, timePart] = str.split(' ');
        if (!datePart || !timePart) return str;
        const [year, month, day] = datePart.split('-');
        const [hours, minutes] = timePart.split(':');
        return `${day}-${month}-${year} ${hours}:${minutes}`;
    }

    function formatHoursToHHMM(hoursDecimal) {
        if (hoursDecimal === undefined || hoursDecimal === null) return '—';
        const totalMinutes = Math.round(hoursDecimal * 60);
        const hh = Math.floor(totalMinutes / 60);
        const mm = totalMinutes % 60;
        return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
    }

    function formatMinutesToHHMM(minutes) {
        if (minutes === undefined || minutes === null) return '—';
        const hh = Math.floor(minutes / 60);
        const mm = minutes % 60;
        return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.background = isError ? '#dc2626' : '#10b981';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ========== API ==========
    async function fetchWithAuth(url, options = {}) {
        const resp = await fetch(url, { ...options, credentials: 'include' });
        if (resp.status === 401) {
            window.location.replace('/static/login.html');
            throw new Error('Unauthorized');
        }
        return resp;
    }

    async function loadEmployeeNameAndId() {
        try {
            const resp = await fetchWithAuth('/api/auth/profile');
            const data = await resp.json();
            if (data.is_admin || data.is_monitor) {
                const monitorTabBtn = document.getElementById('monitorTab');
                if (monitorTabBtn) monitorTabBtn.style.display = 'inline-block';
            }
            document.getElementById('employeeName').innerHTML = `
                <strong>Сотрудник:</strong> ${escapeHtml(data.full_name)}<br>
                <strong>Логин:</strong> ${escapeHtml(data.username)} (ID: ${data.id})
            `;
            const adminBtn = document.getElementById('adminPanelBtn');
            if (adminBtn) {
                if (data.is_admin) {
                    adminBtn.style.display = 'inline-block';
                    adminBtn.onclick = () => window.location.href = '/admin';
                } else {
                    adminBtn.style.display = 'none';
                }
            }
            return data.id;
        } catch (err) {
            console.error(err);
            return null;
        }
    }

    async function loadEmployeeSummary() {
        try {
            const resp = await fetchWithAuth('/api/auth/daily-summary');
            const data = await resp.json();
            document.getElementById('statusDay').innerText = data.status_day;
            document.getElementById('statusBreak').innerText = data.status_break;
            document.getElementById('workedToday').innerText = formatHoursToHHMM(data.worked_hours_current);
            document.getElementById('breakToday').innerText = formatMinutesToHHMM(data.break_minutes_current);
            document.getElementById('breakCountToday').innerText = data.break_count;
        } catch (err) {
            console.error(err);
            document.getElementById('statusDay').innerText = 'Ошибка загрузки';
        }
    }

    async function loadTodayEntries(employeeId) {
        const today = getLocalDate();
        try {
            const resp = await fetchWithAuth(`/api/reports/employee/${employeeId}?date=${today}`);
            const data = await resp.json();
            const container = document.getElementById('entriesContainer');
            if (!data.entries.length) {
                container.innerHTML = '<p>Нет отметок за сегодня</p>';
                return [];
            }
            let html = '<table style="width:100%; border-collapse: collapse;"><thead><tr><th>Время</th><th>Действие</th></tr></thead><tbody>';
            for (const entry of data.entries) {
                const formattedTime = formatDateTime(entry.timestamp);
                html += `<tr><td>${formattedTime}</td><td>${escapeHtml(entry.action)}</td></tr>`;
            }
            html += '</tbody></table>';
            container.innerHTML = html;
            return data.entries;
        } catch (err) {
            console.error(err);
            document.getElementById('entriesContainer').innerHTML = '<p>Ошибка загрузки отметок</p>';
            return [];
        }
    }

    async function getLastAction(employeeId) {
        try {
            const resp = await fetchWithAuth(`/api/timelog/last/${employeeId}`);
            const data = await resp.json();
            return data.last_action;
        } catch (err) {
            console.error(err);
            return null;
        }
    }

    let isSending = false;
    let currentEmployeeId = null;

    async function sendAction(action) {
        if (isSending) {
            showToast('Подождите, предыдущий запрос обрабатывается', true);
            return;
        }
        if (!currentEmployeeId) {
            showToast('Ошибка: не удалось определить сотрудника', true);
            return;
        }
        isSending = true;
        const btns = document.querySelectorAll('.action-btn');
        btns.forEach(btn => btn.disabled = true);

        try {
            const resp = await fetchWithAuth('/api/timelog', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentEmployeeId, action: action })
            });
            if (resp.ok) {
                showToast(`✅ ${action} успешно`, false);
                await refreshState();
            } else {
                let errorMsg = `Ошибка ${resp.status}`;
                try {
                    const err = await resp.json();
                    errorMsg = err.detail || errorMsg;
                } catch(e) {}
                showToast(errorMsg, true);
            }
        } catch (err) {
            showToast('Ошибка соединения с сервером', true);
        } finally {
            isSending = false;
            setTimeout(() => {
                btns.forEach(btn => btn.disabled = false);
            }, 500);
        }
    }

    function getAvailableActions(lastAction) {
        if (!lastAction) return ['start'];
        switch (lastAction) {
            case 'start': return ['break_start', 'end'];
            case 'break_start': return ['break_end'];
            case 'break_end': return ['break_start', 'end'];
            case 'end': return ['start'];
            default: return ['start'];
        }
    }

    function renderButtons(availableActions) {
        const container = document.getElementById('actionButtons');
        container.innerHTML = '';
        const buttonConfig = {
            'start': { text: '🚀 Начать работу', class: '' },
            'break_start': { text: '☕ Перерыв (начало)', class: 'break' },
            'break_end': { text: '✅ Перерыв (конец)', class: 'break' },
            'end': { text: '🏁 Завершить работу', class: 'end' }
        };
        for (const action of availableActions) {
            const config = buttonConfig[action];
            if (!config) continue;
            const btn = document.createElement('button');
            btn.textContent = config.text;
            btn.className = `action-btn ${config.class}`;
            btn.onclick = () => sendAction(action);
            container.appendChild(btn);
        }
    }

    async function refreshState() {
        const empId = await loadEmployeeNameAndId();
        if (!empId) return;
        currentEmployeeId = empId;
        await loadEmployeeSummary();
        await loadTodayEntries(empId);
        const lastAction = await getLastAction(empId);
        const availableActions = getAvailableActions(lastAction);
        renderButtons(availableActions);
    }

    // ========== Недельный отчёт ==========
    function getWeekNumber(date) {
        const firstJan = new Date(date.getFullYear(), 0, 1);
        const days = Math.floor((date - firstJan) / (24 * 60 * 60 * 1000));
        return Math.ceil((days + firstJan.getDay() + 1) / 7);
    }

    function getMonday(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = (day === 0 ? -6 : 1) - day;
        d.setDate(d.getDate() + diff);
        return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    function getMondayOfWeek(year, week) {
        const date = new Date(year, 0, 1);
        const days = (week - 1) * 7;
        date.setDate(date.getDate() + days);
        return getMonday(date);
    }

    async function loadWeeklyReport(weekStart) {
        const container = document.getElementById('weeklyContainer');
        container.innerHTML = '<p>Загрузка...</p>';
        try {
            const resp = await fetchWithAuth(`/api/auth/weekly-summary?start_date=${weekStart}`);
            const data = await resp.json();
            if (!data.days.length) {
                container.innerHTML = '<p>Нет данных за эту неделю</p>';
                return;
            }
            let html = '<table style="width:100%;"><thead><tr><th>День</th><th>Отработано</th><th>Перерывы</th></tr></thead><tbody>';
            for (const day of data.days) {
                html += `<tr>
                            <td>${escapeHtml(day.weekday)} (${day.date})</td>
                            <td>${formatHoursToHHMM(day.worked_hours)}</td>
                            <td>${formatMinutesToHHMM(day.break_minutes)}</td>
                         </tr>`;
            }
            html += `<tr style="border-top: 2px solid #cbd5e1;">
                        <td><strong>Итого</strong></td>
                        <td><strong>${formatHoursToHHMM(data.total_worked_hours)}</strong></td>
                        <td><strong>${formatMinutesToHHMM(data.total_break_minutes)}</strong></td>
                     </tr>`;
            html += '</tbody></table>';
            container.innerHTML = html;
        } catch (err) {
            container.innerHTML = '<p>Ошибка загрузки</p>';
            showToast(err.message, true);
        }
    }

    function initTabs() {
        const tabs = document.querySelectorAll('.tab-btn');
        const dailyTab = document.getElementById('daily-tab');
        const weeklyTab = document.getElementById('weekly-tab');
        const monitorTabDiv = document.getElementById('monitor-tab');
        const weekPicker = document.getElementById('weekPicker');
        const loadWeeklyBtn = document.getElementById('loadWeeklyBtn');

        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.dataset.tab;
                tabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                dailyTab.style.display = 'none';
                weeklyTab.style.display = 'none';
                if (monitorTabDiv) monitorTabDiv.style.display = 'none';

                if (tabId === 'daily') {
                    dailyTab.style.display = 'block';
                    refreshState();
                } else if (tabId === 'weekly') {
                    weeklyTab.style.display = 'block';
                    if (!weekPicker.value) {
                        const now = new Date();
                        const year = now.getFullYear();
                        const weekNumber = getWeekNumber(now);
                        weekPicker.value = `${year}-W${weekNumber.toString().padStart(2, '0')}`;
                        const monday = getMonday(now);
                        const y = monday.getFullYear();
                        const m = String(monday.getMonth() + 1).padStart(2, '0');
                        const d = String(monday.getDate()).padStart(2, '0');
                        loadWeeklyReport(`${y}-${m}-${d}`);
                    } else {
                        const weekValue = weekPicker.value;
                        if (weekValue) {
                            const [year, week] = weekValue.split('-W');
                            const monday = getMondayOfWeek(parseInt(year), parseInt(week));
                            const y = monday.getFullYear();
                            const m = String(monday.getMonth() + 1).padStart(2, '0');
                            const d = String(monday.getDate()).padStart(2, '0');
                            loadWeeklyReport(`${y}-${m}-${d}`);
                        }
                    }
                } else if (tabId === 'monitor') {
                    if (monitorTabDiv) monitorTabDiv.style.display = 'block';
                    const monitorDate = document.getElementById('monitorDate');
                    if (!monitorDate.value) monitorDate.value = getLocalDate();
                    loadMonitorReport(monitorDate.value);
                }
            });
        });

        loadWeeklyBtn.addEventListener('click', () => {
            const weekValue = weekPicker.value;
            if (weekValue) {
                const [year, week] = weekValue.split('-W');
                const monday = getMondayOfWeek(parseInt(year), parseInt(week));
                const y = monday.getFullYear();
                const m = String(monday.getMonth() + 1).padStart(2, '0');
                const d = String(monday.getDate()).padStart(2, '0');
                loadWeeklyReport(`${y}-${m}-${d}`);
            }
        });
    }

    // ========== Выход ==========
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        try {
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            window.location.replace('/static/login.html');
        } catch (err) {
            showToast('Ошибка выхода', true);
        }
    });

    // ========== Инициализация ==========
    initTabs();
    refreshState();

    const modal = document.getElementById('changePasswordModal');
    const changePwdBtn = document.getElementById('changePasswordBtn');
    const closeModal = document.querySelector('#changePasswordModal .close');
    const savePwdBtn = document.getElementById('savePasswordBtn');

    changePwdBtn.onclick = () => {
        modal.style.display = 'block';
        document.getElementById('oldPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
        document.getElementById('passwordError').innerText = '';
    };

    closeModal.onclick = () => modal.style.display = 'none';
    window.onclick = (event) => {
        if (event.target === modal) modal.style.display = 'none';
    };

    savePwdBtn.onclick = async () => {
        const oldPwd = document.getElementById('oldPassword').value;
        const newPwd = document.getElementById('newPassword').value;
        const confirmPwd = document.getElementById('confirmPassword').value;
        const errorSpan = document.getElementById('passwordError');
        errorSpan.innerText = '';

        if (newPwd !== confirmPwd) {
            errorSpan.innerText = 'Новые пароли не совпадают';
            return;
        }
        if (newPwd.length < 4) {
            errorSpan.innerText = 'Пароль должен содержать минимум 4 символа';
            return;
        }
        try {
            const resp = await fetchWithAuth('/api/auth/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ old_password: oldPwd, new_password: newPwd })
            });
            if (resp.ok) {
                showToast('Пароль успешно изменён', false);
                modal.style.display = 'none';
            } else {
                const err = await resp.json();
                errorSpan.innerText = err.detail || 'Ошибка смены пароля';
            }
        } catch (err) {
            errorSpan.innerText = 'Ошибка соединения с сервером';
        }
    };

    async function loadMonitorReport(date) {
        const container = document.getElementById('monitorContainer');
        container.innerHTML = '<p>Загрузка...</p>';
        try {
            const resp = await fetch(`/api/reports/daily?date=${date}`);
            if (!resp.ok) throw new Error('Ошибка загрузки');
            let report = await resp.json();
            if (!report.length) {
                container.innerHTML = '<p>Нет данных за этот день</p>';
                return;
            }
            if (monitorFilterEnabled) {
                const getStatusPriority = (row) => {
                    let key;
                    if (row.status_break === '☕ в перерыве') key = 'onbreak';
                    else if (row.status_day === '✅ работает') key = 'working';
                    else if (row.status_day === '❌ не начал') key = 'notstarted';
                    else if (row.status_day === '🏁 завершил') key = 'ended';
                    else return 99;
                    const idx = monitorStatusOrder.indexOf(key);
                    return idx !== -1 ? idx : 99;
                };
                report.sort((a, b) => {
                    const priorityA = getStatusPriority(a);
                    const priorityB = getStatusPriority(b);
                    if (priorityA !== priorityB) return priorityA - priorityB;
                    return a.full_name.localeCompare(b.full_name, 'ru');
                });
            } else {
                report.sort((a, b) => a.full_name.localeCompare(b.full_name, 'ru'));
            }
            let html = '<table class="report-table" style="width:100%; border-collapse: collapse;"><thead>';
            html += '<tr><th>Сотрудник</th><th>Статус дня</th><th>Начало рабочего дня</th><th>Статус перерыва</th><th>Последняя отметка</th><th>Отработано</th><th>Перерывы</th><th>Кол-во перерывов</th></tr></thead><tbody>';
            for (const row of report) {
                let rowClass = '';
                if (row.status_day === '❌ не начал') rowClass = 'row-not-started';
                else if (row.status_break === '☕ в перерыве') rowClass = 'row-on-break';
                else if (row.status_day === '✅ работает') rowClass = 'row-working';
                else if (row.status_day === '🏁 завершил') rowClass = 'row-ended';
                
                let lastEntryDisplay = '';
                if (row.last_entry_time) {
                    const timePart = row.last_entry_time.slice(11,16);
                    let actionText = '';
                    switch (row.last_entry_action) {
                        case 'start': actionText = 'Начало дня'; break;
                        case 'break_start': actionText = 'Начало перерыва'; break;
                        case 'break_end': actionText = 'Конец перерыва'; break;
                        case 'end': actionText = 'Конец дня'; break;
                        default: actionText = row.last_entry_action;
                    }
                    lastEntryDisplay = `${timePart} - ${actionText}`;
                }
                let startTimeDisplay = row.first_start_time ? row.first_start_time.slice(11,16) : '';
                html += `<tr class="${rowClass}">
                            <td>${escapeHtml(row.full_name)}</td>
                            <td>${escapeHtml(row.status_day)}</td>
                            <td>${startTimeDisplay}</td>
                            <td>${escapeHtml(row.status_break)}</td>
                            <td>${lastEntryDisplay}</td>
                            <td>${formatHoursToHHMM(row.worked_hours_current)}</td>
                            <td>${formatMinutesToHHMM(row.break_minutes_current)}</td>
                            <td>${row.break_count}</td>
                        </tr>`;
            }
            html += '</tbody></table>';
            container.innerHTML = html;
            const style = document.createElement('style');
            style.textContent = `
                .report-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
                .report-table th, .report-table td { padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: left; }
                .row-not-started { background-color: #f1f5f9; }
                .row-working { background-color: #dcfce7; }
                .row-on-break { background-color: #fef9c3; }
                .row-ended { background-color: #dbeafe; }
            `;
            container.appendChild(style);
        } catch (err) {
            container.innerHTML = '<p>Ошибка загрузки</p>';
            showToast(err.message, true);
        }
    }

const monitorDateInput = document.getElementById('monitorDate');
const refreshMonitorBtn = document.getElementById('refreshMonitorBtn');
if (monitorDateInput) {
    monitorDateInput.value = getLocalDate();
}
if (refreshMonitorBtn) {
    refreshMonitorBtn.addEventListener('click', () => {
        loadMonitorReport(monitorDateInput.value);
    });
    monitorDateInput.addEventListener('change', () => {
        loadMonitorReport(monitorDateInput.value);
    });
}

let monitorEventSource = null;

function connectMonitorSSE() {
    if (monitorEventSource) monitorEventSource.close();
    monitorEventSource = new EventSource('/api/monitor/events');
    monitorEventSource.addEventListener('update', () => {
        console.log('Получено обновление мониторинга');
        const activeTabBtn = document.querySelector('.tab-btn.active');
        if (activeTabBtn && activeTabBtn.dataset.tab === 'monitor') {
            const monitorDate = document.getElementById('monitorDate').value || getLocalDate();
            loadMonitorReport(monitorDate);
        }
    });
    monitorEventSource.onerror = () => {
        console.warn('SSE мониторинга ошибка, переподключение через 5 секунд');
        monitorEventSource.close();
        setTimeout(connectMonitorSSE, 5000);
    };
}

if (monitorDateInput) {
    monitorDateInput.value = getLocalDate();
}
connectMonitorSSE();

// ========== Фильтр мониторинга ==========
let monitorFilterEnabled = localStorage.getItem('monitorFilterEnabled') === 'true';
let monitorStatusOrder = [];

function loadMonitorStatusOrder() {
    const saved = localStorage.getItem('monitorStatusOrder');
    if (saved) {
        monitorStatusOrder = JSON.parse(saved);
    } else {
        monitorStatusOrder = ['working', 'onbreak', 'notstarted', 'ended'];
    }
    applyMonitorOrderToUI();
}

function applyMonitorOrderToUI() {
    const container = document.getElementById('monitorStatusOrderList');
    const items = Array.from(container.children);
    items.sort((a, b) => {
        const aIdx = monitorStatusOrder.indexOf(a.dataset.status);
        const bIdx = monitorStatusOrder.indexOf(b.dataset.status);
        return aIdx - bIdx;
    });
    container.innerHTML = '';
    items.forEach(item => container.appendChild(item));
}

function saveMonitorStatusOrder() {
    const items = document.querySelectorAll('#monitorStatusOrderList li');
    monitorStatusOrder = Array.from(items).map(li => li.dataset.status);
    localStorage.setItem('monitorStatusOrder', JSON.stringify(monitorStatusOrder));
    showToast('Порядок статусов сохранён');
    const monitorDate = document.getElementById('monitorDate').value;
    if (monitorDate) loadMonitorReport(monitorDate);
}

function initMonitorDragAndDrop() {
    const list = document.getElementById('monitorStatusOrderList');
    if (!list) return;
    const items = list.querySelectorAll('li');
    items.forEach(item => item.setAttribute('draggable', 'true'));
    let dragItem = null;
    
    list.addEventListener('dragstart', (e) => {
        dragItem = e.target.closest('li');
        if (!dragItem) return;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', '');
        dragItem.classList.add('dragging');
    });
    
    list.addEventListener('dragend', (e) => {
        if (dragItem) dragItem.classList.remove('dragging');
        dragItem = null;
    });
    
    list.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const targetItem = e.target.closest('li');
        if (!targetItem || targetItem === dragItem) return;
        const rect = targetItem.getBoundingClientRect();
        const midpoint = (rect.left + rect.right) / 2;
        if (e.clientX < midpoint) {
            targetItem.parentNode.insertBefore(dragItem, targetItem);
        } else {
            targetItem.parentNode.insertBefore(dragItem, targetItem.nextSibling);
        }
    });
}

function toggleMonitorFilter() {
    monitorFilterEnabled = !monitorFilterEnabled;
    localStorage.setItem('monitorFilterEnabled', monitorFilterEnabled);
    const settingsDiv = document.getElementById('monitorStatusOrderSettings');
    const toggleBtn = document.getElementById('toggleMonitorFilterBtn');
    if (monitorFilterEnabled) {
        settingsDiv.style.display = 'block';
        toggleBtn.textContent = '🎛️ Скрыть фильтр статусов';
        loadMonitorStatusOrder();
        initMonitorDragAndDrop();
    } else {
        settingsDiv.style.display = 'none';
        toggleBtn.textContent = '🎛️ Фильтр по статусам';
    }
    const currentDate = document.getElementById('monitorDate').value;
    if (currentDate) loadMonitorReport(currentDate);
}

const monitorToggleBtn = document.getElementById('toggleMonitorFilterBtn');
if (monitorToggleBtn) {
    monitorToggleBtn.addEventListener('click', toggleMonitorFilter);
    if (monitorFilterEnabled) {
        document.getElementById('monitorStatusOrderSettings').style.display = 'block';
        monitorToggleBtn.textContent = '🎛️ Скрыть фильтр статусов';
        loadMonitorStatusOrder();
        initMonitorDragAndDrop();
    } else {
        document.getElementById('monitorStatusOrderSettings').style.display = 'none';
        monitorToggleBtn.textContent = '🎛️ Фильтр по статусам';
    }
}
document.getElementById('saveMonitorStatusOrderBtn')?.addEventListener('click', saveMonitorStatusOrder);
</script>
