<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход для администратора</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: white;
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 { margin-top: 0; color: #0f172a; }
        input { width: 100%; padding: 12px; margin: 8px 0 16px; border: 1px solid #cbd5e1; border-radius: 20px; font-size: 1rem; }
        button { width: 100%; background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 40px; font-size: 1rem; cursor: pointer; }
        .error { color: #dc2626; margin-top: 12px; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="login-card">
    <h1>Вход для администратора</h1>
    <form id="loginForm">
        <label>Пароль администратора</label>
        <input type="password" id="password" required>
        <button type="submit">Войти</button>
        <div id="errorMessage" class="error"></div>
    </form>
</div>
<script>
    const form = document.getElementById('loginForm');
    const errorDiv = document.getElementById('errorMessage');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        errorDiv.innerText = '';
        try {
            const resp = await fetch('/api/auth/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: password })
            });
            if (resp.ok) {
                window.location.href = '/admin';
            } else {
                const err = await resp.json();
                errorDiv.innerText = err.detail || 'Ошибка входа';
            }
        } catch (err) {
            errorDiv.innerText = 'Ошибка соединения с сервером';
        }
    });
</script>
</body>
</html>
