<div class="sandbox-container">

    <!-- Боковая панель -->
    <div class="sandbox-sidebar">
        <button class="nav-btn active" data-target="deals"><span class="icon">📋</span> Сделки</button>
        <button class="nav-btn" data-target="counterparties"><span class="icon">🏢</span> ИП/МП</button>
        <button class="nav-btn" data-target="products"><span class="icon">📦</span> Товары</button>
        <button class="nav-btn" data-target="tasks"><span class="icon">⚙️</span> Задачи</button>
        <button class="nav-btn" data-target="roles"><span class="icon">👥</span> Роли</button>
    </div>

    <!-- Основная область -->
    <div class="sandbox-content">

        <!-- ==================== ПАНЕЛЬ: СДЕЛКИ (оставлена как есть) ==================== -->
        <div class="sandbox-panel active" id="panel-deals">
            <div class="toolbar">
                <button id="refreshDealsBtn">🔄 Обновить</button>
                <button id="createDealBtn" class="success">➕ Создать сделку</button>
                <select id="statusFilter" style="padding:8px 12px; border-radius:20px; border:1px solid #cbd5e1; height:38px;">
                    <option value="">Все статусы</option>
                    <option value="draft">Черновик</option>
                    <option value="active">Активна</option>
                    <option value="completed">Завершена</option>
                    <option value="cancelled">Отменена</option>
                </select>
                <span style="margin-left:auto; color:#64748b; font-size:0.9rem;" id="dealsCount">Загрузка...</span>
            </div>
            <div id="dealsList"><p style="color:#94a3b8;">Загрузка сделок...</p></div>
        </div>

        <!-- ==================== ПАНЕЛЬ: ИП/МП ==================== -->
        <div class="sandbox-panel" id="panel-counterparties">
            <div class="toolbar">
                <button id="refreshCounterpartiesBtn">🔄 Обновить</button>
            </div>

            <!-- ===== ТИПЫ СДЕЛОК ===== -->
            <div style="margin-bottom: 24px;">
                <h4 style="margin:0 0 8px 0;">📋 Типы сделок</h4>
                <div class="inline-form" id="addDealTypeForm" style="margin-bottom:8px;">
                    <div class="form-group" style="flex:1;">
                        <input type="text" id="newDealTypeName" placeholder="Название (FBS, FBP, FSK)">
                    </div>
                    <button class="success" id="saveDealTypeBtn">➕ Добавить</button>
                </div>
                <div id="dealTypesList"><p style="color:#94a3b8;">Загрузка...</p></div>
            </div>

            <!-- ===== ИП ===== -->
            <div style="margin-bottom: 24px;">
                <h4 style="margin:0 0 8px 0;">🏢 ИП</h4>
                <div class="inline-form" id="addIPForm" style="margin-bottom:8px;">
                    <div class="form-group" style="flex:1;">
                        <input type="text" id="newIPName" placeholder="Название ИП (KTV, KPD, REG, SIA)">
                    </div>
                    <button class="success" id="saveIPBtn">➕ Добавить</button>
                </div>
                <div id="ipsList"><p style="color:#94a3b8;">Загрузка...</p></div>
            </div>

            <!-- ===== МП ===== -->
            <div>
                <h4 style="margin:0 0 8px 0;">📦 МП</h4>
                <div class="inline-form" id="addMPForm" style="margin-bottom:8px;">
                    <div class="form-group" style="flex:1;">
                        <input type="text" id="newMPName" placeholder="Название МП (OZ, WB)">
                    </div>
                    <button class="success" id="saveMPBtn">➕ Добавить</button>
                </div>
                <div id="mpsList"><p style="color:#94a3b8;">Загрузка...</p></div>
            </div>
        </div>

        <!-- ==================== ПАНЕЛЬ: ТОВАРЫ ==================== -->
        <div class="sandbox-panel" id="panel-products">
            <h3 style="margin-top:0;">📦 Товары</h3>
            <!-- Форма добавления товара -->
            <div class="inline-form" id="addProductForm">
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="productName" placeholder="Название товара">
                </div>
                <button class="success" id="saveProductBtn">➕ Добавить</button>
            </div>
            <!-- Список товаров -->
            <div id="productsList"><p style="color:#94a3b8;">Загрузка товаров...</p></div>
        </div>

        <!-- ==================== ПАНЕЛЬ: ЗАДАЧИ ==================== -->
        <div class="sandbox-panel" id="panel-tasks">
            <h3 style="margin-top:0;">⚙️ Задачи</h3>

            <!-- Блок управления типами задач -->
            <div style="margin-bottom: 24px;">
                <h4>Типы задач</h4>
                <div class="inline-form" id="addTaskTypeForm">
                    <div class="form-group">
                        <label>Название типа</label>
                        <input type="text" id="taskTypeName" placeholder="Например, Печать">
                    </div>
                    <button class="success" id="saveTaskTypeBtn">➕ Добавить тип</button>
                </div>
                <div id="taskTypeList" class="task-type-list"><p style="color:#94a3b8;">Загрузка...</p></div>
            </div>

            <!-- Блок управления задачами (экземплярами) -->
            <div>
                <h4>Список задач</h4>
                <div class="inline-form" id="addTaskForm">
                    <div class="form-group">
                        <label>Название задачи</label>
                        <input type="text" id="taskName" placeholder="Название задачи">
                    </div>
                    <div class="form-group">
                        <label>Тип</label>
                        <select id="taskTypeSelect"></select>
                    </div>
                    <button class="success" id="saveTaskBtn">➕ Добавить задачу</button>
                </div>
                <div id="tasksList"><p style="color:#94a3b8;">Загрузка...</p></div>
            </div>
        </div>

        <!-- ==================== ПАНЕЛЬ: РОЛИ ==================== -->
        <div class="sandbox-panel" id="panel-roles">
            <div class="toolbar">
                <button id="refreshRolesBtn">🔄 Обновить</button>
                <button id="addRoleBtn" class="success">➕ Добавить роль</button>
            </div>
            <div id="rolesList"><p style="color:#94a3b8;">Загрузка ролей...</p></div>
        </div>

    </div>
    <!-- ========== МОДАЛЬНОЕ ОКНО ДЛЯ СОЗДАНИЯ СДЕЛКИ ========== -->
    <div id="createDealModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="closeCreateModal">&times;</span>
            <h3>Создание новой сделки</h3>
            <form id="createDealForm">
                <div class="form-group">
                    <label>Название сделки</label>
                    <input type="text" id="dealTitle" placeholder="Введите название" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Тип сделки</label>
                        <select id="dealType" required></select>
                    </div>
                    <div class="form-group">
                        <label>Клиент</label>
                        <select id="dealClient" required></select>
                    </div>
                    <div class="form-group">
                        <label>Плановая дата</label>
                        <input type="date" id="dealPlannedDate" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Товары и этапы</label>
                    <div id="productsContainer">
                        <div style="display:flex; gap:8px; align-items:center; margin-bottom:12px;">
                            <input type="text" class="product-name-input" placeholder="Название товара" style="flex:1; padding:8px; border-radius:20px; border:1px solid #cbd5e1;">
                            <input type="text" class="product-tech-card-input" placeholder="Этапы через запятую" style="flex:1; padding:8px; border-radius:20px; border:1px solid #cbd5e1;">
                            <button type="button" class="add-product-btn" style="background:#3b82f6; color:white; border:none; border-radius:50%; width:32px; height:32px; cursor:pointer; font-size:1.2rem;">+</button>
                        </div>
                        <div id="productList"></div>
                    </div>
                </div>
                <div style="display:flex; gap:12px; margin-top:16px;">
                    <button type="submit" class="success" style="padding:8px 24px;">Создать</button>
                    <button type="button" id="cancelCreateBtn" style="background:#94a3b8; padding:8px 24px;">Отмена</button>
                </div>
                <div id="createError" style="color:red; margin-top:8px;"></div>
            </form>
        </div>
    </div>

    <!-- ========== МОДАЛЬНОЕ ОКНО ДЛЯ ПРОСМОТРА СДЕЛКИ ========== -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="closeDetailModal">&times;</span>
            <div id="detailContent">
                <h3 id="detailTitle">Загрузка...</h3>
                <div id="detailBody"></div>
            </div>
        </div>
    </div>
</div>
