        <div id="createDealModal" class="modal">
            <div class="modal-content">
                <span class="modal-close" id="closeCreateModal">&times;</span>
                <h3>Создание новой сделки</h3>

                    <div class="form-group">
                        <label>Название сделки</label>
                        <input type="text" id="dealTitle" placeholder="Введите название" required>
                    </div>
                    <div class="form-group">
                        <label>Тип сделки</label>
                        <select id="dealType" required></select>
                    </div>
                    <div class="form-group">
                        <label>ИП</label>
                        <select id="dealIp" required>
                            <option value="">Выберите ИП</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>МП</label>
                        <select id="dealMp" required>
                            <option value="">Выберите МП</option>
                        </select>
                    </div>
                    <div style="display:flex; gap:12px; margin-top:16px;">
                        <button type="submit" class="success" style="padding:8px 24px;">Создать</button>
                        <button type="button" id="cancelCreateBtn" style="background:#94a3b8; padding:8px 24px;">Отмена</button>
                    </div>
                    <div id="createError" style="color:red; margin-top:8px;"></div>
                </form>
            </div>
        </div>
        <!-- ========== МОДАЛЬНОЕ ОКНО ДЛЯ ПРОСМОТРА СДЕЛКИ ========== -->
        <div id="detailModal" class="modal">
            <div class="modal-content">
                <span class="modal-close" id="closeDetailModal">&times;</span>
                <div id="detailContent">

                    <div id="detailBody"></div>
                </div>
            </div>
        </div>

        <div id="productModal" class="modal">
            <div class="modal-content" style="max-width: 450px;">
                <span class="close-product-modal" style="float:right; cursor:pointer; font-size:1.5rem;">&times;</span>
                <h3 id="productModalTitle">Создание товара</h3>
                <form id="productForm">
                    <div class="form-group">
                        <label>Название товара <span style="color:red;">*</span></label>
                        <input type="text" id="productNameInput" placeholder="Короткое название" required style="width:100%; padding:8px; border-radius:20px; border:1px solid #cbd5e1; margin-top:4px;">
                    </div>
                    <div class="form-group" style="margin-top:12px;">
                        <label>Полное наименование</label>
                        <input type="text" id="productFullNameInput" placeholder="Полное наименование (опционально)" style="width:100%; padding:8px; border-radius:20px; border:1px solid #cbd5e1; margin-top:4px;">
                    </div>
                    <div class="form-group" style="margin-top:12px;">
                        <label>Техкарта</label>
                        <select id="productTechCardSelect" style="width:100%; padding:8px; border-radius:20px; border:1px solid #cbd5e1; margin-top:4px;">
                            <option value="">Без техкарты</option>
                        </select>
                    </div>
                    <div style="display:flex; gap:12px; margin-top:16px; justify-content:flex-end;">
                        <button type="button" id="cancelProductBtn" style="background:#94a3b8; border:none; color:white; padding:8px 16px; border-radius:20px; cursor:pointer;">Отмена</button>
                        <button type="submit" id="saveProductBtn" style="background:#22c55e; border:none; color:white; padding:8px 16px; border-radius:20px; cursor:pointer;">Сохранить</button>
                    </div>
                    <div id="productFormError" style="color:red; margin-top:8px;"></div>
                </form>
            </div>
        </div>
