<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Сканер отметок</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #f0f2f5;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            background: white;
            max-width: 500px;
            width: 100%;
            border-radius: 32px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            padding: 24px;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            color: #1e293b;
            margin-top: 0;
            margin-bottom: 8px;
        }
        .sub {
            color: #475569;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }
        .qr-input {
            position: absolute;
            left: -9999px;
            opacity: 0;
            width: 1px;
            height: 1px;
        }
        .status {
            margin-top: 24px;
            padding: 12px;
            border-radius: 60px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .status.success {
            background: #dcfce7;
            color: #166534;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }
        .status.info {
            background: #e6f0ff;
            color: #1e40af;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 1000;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
        }
        .employee-info {
            margin-top: 20px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #0f172a;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Сканер Штрих-кода</h1>
    <div class="sub">Отсканируй штрих-код сотрудника</div>

    <input type="text" id="qrInput" class="qr-input" autofocus>

    <div class="status info" id="statusMessage">✅ Готов к сканированию</div>
    <div class="employee-info" id="employeeInfo" style="display: none;">
        👤 <span id="empName"></span> — <span id="empAction"></span>
    </div>

    <div style="margin-top: 30px;">
        <a href="/static/login.html" style="display: inline-block; background: #10b981; color: white; padding: 10px 20px; border-radius: 40px; text-decoration: none;">🔐 Войти в личный кабинет</a>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
    const input = document.getElementById('qrInput');
    const statusDiv = document.getElementById('statusMessage');
    const employeeInfoDiv = document.getElementById('employeeInfo');
    const empNameSpan = document.getElementById('empName');
    const empActionSpan = document.getElementById('empAction');
    const toast = document.getElementById('toast');

    function showToast(message, isError = false) {
        toast.textContent = message;
        toast.classList.add('show');
        toast.style.backgroundColor = isError ? '#dc2626' : '#10b981';
        setTimeout(() => {
            toast.classList.remove('show');
            toast.style.backgroundColor = '#1e293b';
        }, 2500);
    }

    function setStatus(text, type = 'info') {
        statusDiv.textContent = text;
        statusDiv.className = 'status ' + type;
    }

    function showEmployeeInfo(name, action) {
        if (name && action) {
            empNameSpan.textContent = name;
            empActionSpan.textContent = action;
            employeeInfoDiv.style.display = 'block';
        } else {
            employeeInfoDiv.style.display = 'none';
        }
    }

    async function processScan(data) {
        if (!data || data.trim() === '') return;

        const parts = data.split(':');
        if (parts.length !== 2) {
            setStatus('❌ Неверный формат штрих-кода. Ожидается ID:действие', 'error');
            showToast('Неверный формат штрих-кода', true);
            return;
        }

        const userId = parseInt(parts[0], 10);
        const action = parts[1];

        if (isNaN(userId)) {
            setStatus('❌ ID сотрудника должен быть числом', 'error');
            showToast('Ошибка: ID не число', true);
            return;
        }

        const validActions = ['start', 'break_start', 'break_end', 'end'];
        if (!validActions.includes(action)) {
            setStatus(`❌ Недопустимое действие: ${action}`, 'error');
            showToast(`Недопустимое действие: ${action}`, true);
            return;
        }

        setStatus(`⏳ Отправка... (${userId}:${action})`, 'info');

        try {
            const response = await fetch('/api/timelog', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, action: action })
            });

            if (response.ok) {
                setStatus(`✅ Отмечено! Действие: ${action}`, 'success');
                showToast(`✅ ${action} для сотрудника ${userId}`, false);
                showEmployeeInfo(`Сотрудник ${userId}`, action);
            } else {
                let errorMsg = `Ошибка ${response.status}`;
                try {
                    const err = await response.json();
                    errorMsg = err.detail || errorMsg;
                } catch(e) {}
                setStatus(`❌ Ошибка: ${errorMsg}`, 'error');
                showToast(`Ошибка: ${errorMsg}`, true);
                showEmployeeInfo('', '');
            }
        } catch (error) {
            console.error('Network error:', error);
            setStatus('❌ Ошибка соединения с сервером', 'error');
            showToast('Нет связи с сервером', true);
            showEmployeeInfo('', '');
        } finally {
            input.value = '';
            input.focus();
        }
    }

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            const rawData = input.value.trim();
            if (rawData) {
                processScan(rawData);
            } else {
                input.focus();
            }
        }
    });

    input.addEventListener('blur', () => {
        setTimeout(() => input.focus(), 100);
    });

    input.focus();
</script>
</body>
</html>
