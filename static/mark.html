<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маркировка</title>
    <link rel="icon" type="image/png" href="/static/ttr.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            height: 100%; /* занимает всю доступную высоту */
            max-height: calc(100vh - 32px); /* не вылезает за экран */
            background: white;
            border-radius: 32px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* ничего не вылезает */
        }

        /* Верхняя строка: логотип, поле ввода, маркировка, картинка */
        .top-row {
            display: flex;
            gap: 24px;
            flex: 0 0 auto; /* не растягивается */
            align-items: stretch;
            min-height: 0;
        }
        .left-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }
        .search-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap;
        }
        .logo-btn {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #e2e8f0;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            text-decoration: none;
        }
        .logo-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-btn:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        .input-marking-wrapper {
            display: flex;
            align-items: center;
            flex: 1;
            gap: 12px;
            min-width: 0;
        }
        #scanInput {
            flex: 0 0 60%;
            padding: 12px 18px;
            font-size: 1rem;
            border: 2px solid #3b82f6;
            border-radius: 60px;
            outline: none;
            background: #f8fafc;
            transition: 0.2s;
            min-width: 0;
        }
        #scanInput:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
            background: white;
        }
        #scanInput::placeholder {
            color: #94a3b8;
        }
        #markingDisplay {
            font-weight: bold;
            font-size: 1.1rem;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #scanResult {
            flex: 1; /* занимает всё оставшееся место */
            display: flex;
            align-items: center; /* вертикальное центрирование */
            overflow: hidden;
        }

        .right-column {
            flex: 0 0 280px; /* фиксированная ширина картинки */
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            min-height: 0;
            max-height: 100%;
        }
        .right-column img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            max-height: 100%;
        }
        .right-column .no-image {
            color: #94a3b8;
            font-size: 1rem;
            text-align: center;
            padding: 20px;
        }

        /* текстовая карточка (без картинки) */
        .product-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 0;
            width: 100%;
        }
        .product-info .name-line {
            font-size: 1.4rem;
            font-weight: 600;
            color: #0f172a;
            line-height: 1.3;
        }
        .product-info .name-line .code-part {
            font-weight: 700;
            color: #0f172a;
        }
        .product-info .details-line {
            font-size: 1.1rem;
            color: #334155;
        }
        .product-info .details-line .type-part {
            font-weight: 500;
        }
        .product-info .details-line .fandom-part {
            font-weight: 500;
            color: #475569;
        }

        .no-result { color: #ef4444; text-align: center; padding: 20px 0; font-size: 1.1rem; }
        .loading { text-align: center; color: #64748b; padding: 20px 0; }
        .error {
            color: #ef4444;
            text-align: center;
            padding: 20px;
            background: #fee2e2;
            border-radius: 12px;
        }
        .placeholder-text {
            color: #64748b;
            text-align: center;
            padding: 20px 0;
            width: 100%;
        }

        @media (max-width: 700px) {
            .container { padding: 16px; }
            .top-row {
                flex-direction: column;
                gap: 12px;
            }
            .right-column {
                flex: 0 0 auto;
                width: 100%;
                max-height: 200px;
                min-height: 120px;
            }
            .right-column img {
                max-height: 200px;
            }
            .logo-btn { width: 40px; height: 40px; }
            #scanInput { font-size: 0.95rem; padding: 10px 14px; flex: 1 1 100%; }
            .input-marking-wrapper { flex-wrap: wrap; }
            #markingDisplay { font-size: 1rem; }
            .left-column { gap: 8px; }
            #scanResult { align-items: flex-start; }
            .product-info .name-line { font-size: 1.2rem; }
            .product-info .details-line { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-row">
        <div class="left-column">
            <div class="search-row">
                <a href="/static/employee.html" class="logo-btn" title="Личный кабинет">
                    <img src="/static/ttr.png" alt="ЛК">
                </a>
                <div class="input-marking-wrapper">
                    <input type="text" id="scanInput" placeholder="Штрих-код или артикул..." autofocus>
                    <span id="markingDisplay"></span>
                </div>
            </div>
            <div id="scanResult">
                <p class="placeholder-text">Ожидание сканирования...</p>
            </div>
        </div>
        <div class="right-column" id="imageContainer">
            <div class="no-image">Нет изображения</div>
        </div>
    </div>
</div>
<script>
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            return m;
        });
    }
    function showError(message) {
        document.getElementById('scanResult').innerHTML = `<div class="error">❌ ${escapeHtml(message)}</div>`;
        document.getElementById('markingDisplay').textContent = '';
        document.getElementById('imageContainer').innerHTML = '<div class="no-image">Нет изображения</div>';
    }
    function showLoading() {
        document.getElementById('scanResult').innerHTML = '<div class="loading">⏳ Поиск...</div>';
        document.getElementById('markingDisplay').textContent = '⏳';
        document.getElementById('imageContainer').innerHTML = '<div class="no-image">Загрузка...</div>';
    }

    function renderResults(products) {
        const resultDiv = document.getElementById('scanResult');
        const markingSpan = document.getElementById('markingDisplay');
        const imageContainer = document.getElementById('imageContainer');

        if (!products || products.length === 0) {
            resultDiv.innerHTML = '<div class="no-result">⚠️ Товар не найден</div>';
            markingSpan.textContent = '';
            imageContainer.innerHTML = '<div class="no-image">Нет изображения</div>';
            return;
        }

        const product = products[0];
        const code = product['Код'] || '';
        const type = product['Вид'] || '—';
        const fandom = product['Фандом'] || '—';
        const name = product['Название'] || '—';
        const marking = product['Маркировка'] || '';

        markingSpan.textContent = marking || '';

        const imageUrl = code ? `/static/img/${code}.jpg` : null;

        let infoHtml = `
            <div class="product-info">
                <div class="name-line">
                    <span class="code-part">${escapeHtml(code)}</span>
                    <span>${escapeHtml(name)}</span>
                </div>
                <div class="details-line">
                    <span class="type-part">${escapeHtml(type)}</span>
                    ${fandom ? `, <span class="fandom-part">${escapeHtml(fandom)}</span>` : ''}
                </div>
            </div>
        `;
        resultDiv.innerHTML = infoHtml;

        if (imageUrl) {
            imageContainer.innerHTML = `<img src="${imageUrl}" alt="${escapeHtml(name)}" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'no-image\\'>Нет изображения</div>';">`;
        } else {
            imageContainer.innerHTML = '<div class="no-image">Нет изображения</div>';
        }
    }

    async function checkAuth() {
        try {
            const resp = await fetch('/api/auth/profile', { credentials: 'include' });
            if (!resp.ok) {
                window.location.replace('/static/login.html');
                return false;
            }
            return true;
        } catch (e) {
            window.location.replace('/static/login.html');
            return false;
        }
    }

    function isValidBarcode(code) {
        if (!code || code.length < 5) return false;
        return /^[A-Za-zА-Яа-я0-9_-]+$/.test(code);
    }

    async function performScan(code) {
        if (!code || code.trim() === '') return;
        code = code.trim();
        if (!isValidBarcode(code)) {
            showError('Некорректный штрих-код. Допустимы только буквы, цифры, дефис и подчёркивание (минимум 5 символов).');
            return;
        }
        showLoading();
        try {
            const resp = await fetch(`/api/mark/${encodeURIComponent(code)}`, { credentials: 'include' });
            if (!resp.ok) {
                let errorMsg = `Ошибка ${resp.status}`;
                try {
                    const err = await resp.json();
                    errorMsg = err.detail || errorMsg;
                } catch(e) {}
                showError(errorMsg);
                return;
            }
            const data = await resp.json();
            renderResults(data);
        } catch (err) {
            showError('Ошибка соединения с сервером');
            console.error(err);
        }
    }

    document.addEventListener('DOMContentLoaded', async function() {
        const ok = await checkAuth();
        if (!ok) return;
        const input = document.getElementById('scanInput');
        input.addEventListener('focus', function() { this.select(); });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const code = this.value.trim();
                if (code) {
                    performScan(code);
                    this.value = '';
                }
            }
        });
        input.addEventListener('input', function() {
            if (!this.value.trim()) {
                document.getElementById('markingDisplay').textContent = '';
                document.getElementById('scanResult').innerHTML = '<p class="placeholder-text">Ожидание сканирования...</p>';
                document.getElementById('imageContainer').innerHTML = '<div class="no-image">Нет изображения</div>';
            }
        });
    });
</script>
</body>
</html>
