<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маркировка</title>
    <link rel="icon" type="image/png" href="/static/ttr.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            height: 100%;
            max-height: calc(100vh - 32px);
            background: white;
            border-radius: 32px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Верхняя строка: поиск + болванка таблицы */
        .top-row {
            display: flex;
            gap: 24px;
            flex: 0 0 auto;
            align-items: stretch;
            min-height: 0;
            margin-bottom: 12px;
        }
        .left-search {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }
        .search-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap;
        }
        .logo-btn {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #e2e8f0;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            text-decoration: none;
        }
        .logo-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-btn:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        .input-marking-wrapper {
            display: flex;
            align-items: center;
            flex: 1;
            gap: 12px;
            min-width: 0;
        }
        #scanInput {
            flex: 0 0 55%;
            padding: 12px 18px;
            font-size: 1rem;
            border: 2px solid #3b82f6;
            border-radius: 60px;
            outline: none;
            background: #f8fafc;
            transition: 0.2s;
            min-width: 0;
        }
        #scanInput:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
            background: white;
        }
        #scanInput::placeholder {
            color: #94a3b8;
        }
        #markingDisplay {
            font-weight: bold;
            font-size: 1.1rem;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Болванка таблицы (3x3) справа от поиска */
        .dummy-table {
            flex: 0 0 200px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 8px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 4px;
            justify-content: center;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
        }
        .dummy-table .row {
            display: flex;
            gap: 4px;
        }
        .dummy-table .cell {
            flex: 1;
            border: 1px dashed #cbd5e1;
            border-radius: 4px;
            padding: 6px 4px;
            background: white;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 0.7rem;
        }

        /* Карточка товара */
        .product-card {
            flex: 1;
            display: flex;
            gap: 24px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
            min-height: 0;
        }
        .product-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
            overflow: hidden;
        }
        .product-info .name-line {
            font-size: 1.4rem;
            font-weight: 600;
            color: #0f172a;
            line-height: 1.3;
        }
        .product-info .name-line .code-part {
            font-weight: 700;
            color: #3b82f6;
        }
        .product-info .details-line {
            font-size: 1.1rem;
            color: #334155;
        }
        .product-info .details-line .type-part {
            font-weight: 500;
        }
        .product-info .details-line .fandom-part {
            font-weight: 500;
            color: #475569;
        }

        .table-container {
            flex: 1;
            overflow-y: auto;
            margin-top: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 8px;
            background: #fafafa;
        }
        .table-container table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .table-container th {
            background: #f1f5f9;
            padding: 8px 12px;
            text-align: left;
            font-weight: 600;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .table-container td {
            padding: 6px 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        .table-container tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            color: white;
            text-align: center;
            white-space: nowrap;
        }
        .badge-wb { background: #6b21a5; }
        .badge-oz { background: #1e40af; }
        .badge-fsk { background: #64748b; }

        .product-image {
            flex: 0 0 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            min-height: 0;
        }
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            max-height: 100%;
        }
        .product-image .no-image {
            color: #94a3b8;
            font-size: 1rem;
            text-align: center;
            padding: 20px;
        }

        .no-result { color: #ef4444; text-align: center; padding: 20px 0; font-size: 1.1rem; }
        .loading { text-align: center; color: #64748b; padding: 20px 0; }
        .error {
            color: #ef4444;
            text-align: center;
            padding: 20px;
            background: #fee2e2;
            border-radius: 12px;
        }
        .placeholder-text {
            color: #64748b;
            text-align: center;
            padding: 20px 0;
            width: 100%;
        }

        @media (max-width: 700px) {
            .container { padding: 16px; }
            .top-row { flex-wrap: wrap; }
            .dummy-table { flex: 1 1 100%; min-height: 80px; }
            .product-card { flex-direction: column; align-items: center; }
            .product-image { flex: 0 0 auto; width: 100%; max-height: 200px; min-height: 120px; }
            .product-image img { max-height: 200px; }
            .logo-btn { width: 40px; height: 40px; }
            #scanInput { font-size: 0.95rem; padding: 10px 14px; flex: 1 1 100%; }
            .input-marking-wrapper { flex-wrap: wrap; }
            #markingDisplay { font-size: 1rem; }
            .product-info .name-line { font-size: 1.2rem; }
            .product-info .details-line { font-size: 1rem; }
            .table-container { font-size: 0.8rem; }
            .table-container td, .table-container th { padding: 4px 8px; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Верхняя строка: поиск + болванка таблицы -->
    <div class="top-row">
        <div class="left-search">
            <div class="search-row">
                <a href="/static/employee.html" class="logo-btn" title="Личный кабинет">
                    <img src="/static/ttr.png" alt="ЛК">
                </a>
                <div class="input-marking-wrapper">
                    <input type="text" id="scanInput" placeholder="Штрих-код или артикул..." autofocus>
                    <span id="markingDisplay"></span>
                </div>
            </div>
        </div>
        <!-- Болванка таблицы (3x3) -->
        <div class="dummy-table" id="dummyTable">
            <div class="row">
                <div class="cell">A1</div>
                <div class="cell">B1</div>
                <div class="cell">C1</div>
            </div>
            <div class="row">
                <div class="cell">A2</div>
                <div class="cell">B2</div>
                <div class="cell">C2</div>
            </div>
            <div class="row">
                <div class="cell">A3</div>
                <div class="cell">B3</div>
                <div class="cell">C3</div>
            </div>
        </div>
    </div>

    <!-- Карточка товара -->
    <div id="scanResult" class="product-card" style="display: none; flex: 1;">
        <!-- содержимое будет вставлено скриптом -->
    </div>
    <div id="placeholderMessage" style="flex:1; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 1.1rem;">
        Ожидание сканирования...
    </div>
</div>

<script>
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            return m;
        });
    }

    function showError(message) {
        const resultDiv = document.getElementById('scanResult');
        const placeholder = document.getElementById('placeholderMessage');
        resultDiv.style.display = 'none';
        placeholder.style.display = 'flex';
        placeholder.innerHTML = `<div class="error">❌ ${escapeHtml(message)}</div>`;
        document.getElementById('markingDisplay').textContent = '';
    }

    function showLoading() {
        const resultDiv = document.getElementById('scanResult');
        const placeholder = document.getElementById('placeholderMessage');
        resultDiv.style.display = 'none';
        placeholder.style.display = 'flex';
        placeholder.innerHTML = '<div class="loading">⏳ Поиск...</div>';
        document.getElementById('markingDisplay').textContent = '⏳';
    }

    function renderResults(products) {
        const resultDiv = document.getElementById('scanResult');
        const placeholder = document.getElementById('placeholderMessage');
        const markingSpan = document.getElementById('markingDisplay');

        if (!products || products.length === 0) {
            resultDiv.style.display = 'none';
            placeholder.style.display = 'flex';
            placeholder.innerHTML = '<div class="no-result">⚠️ Товар не найден</div>';
            markingSpan.textContent = '';
            return;
        }

        const product = products[0];
        const code = product['Код'] || '';
        const type = product['Вид'] || '—';
        const fandom = product['Фандом'] || '—';
        const name = product['Название'] || '—';
        const marking = product['Маркировка'] || '';
        const tableData = product['table'] || [];

        markingSpan.textContent = marking || '';
        const imageUrl = code ? `/static/img/${code}.jpg` : null;

        // Строим HTML карточки
        let infoHtml = `
            <div class="product-info">
                <div class="name-line">
                    <span class="code-part">${escapeHtml(code)}</span>
                    <span>${escapeHtml(name)}</span>
                </div>
                <div class="details-line">
                    <span class="type-part">${escapeHtml(type)}</span>
                    ${fandom ? `, <span class="fandom-part">${escapeHtml(fandom)}</span>` : ''}
                </div>
                <div class="table-container">
                    <table>
                        <thead><tr><th>Маркировка</th><th>ID</th><th>Штрих-код</th></tr></thead>
                        <tbody>
        `;
        for (const row of tableData) {
            let badgeClass = '';
            if (row.platform === 'WB') badgeClass = 'badge-wb';
            else if (row.platform === 'OZ') badgeClass = 'badge-oz';
            else badgeClass = 'badge-fsk';
            infoHtml += `
                <tr>
                    <td><span class="badge ${badgeClass}">${escapeHtml(row.marking)}</span></td>
                    <td>${escapeHtml(row.id)}</td>
                    <td>${escapeHtml(row.bar)}</td>
                </tr>
            `;
        }
        infoHtml += `
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="product-image">
                ${imageUrl ? `<img src="${imageUrl}" alt="${escapeHtml(name)}" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'no-image\\'>Нет изображения</div>';">` : '<div class="no-image">Нет изображения</div>'}
            </div>
        `;

        // Вставляем в карточку
        resultDiv.innerHTML = infoHtml;
        resultDiv.style.display = 'flex';
        placeholder.style.display = 'none';
    }

    async function checkAuth() {
        try {
            const resp = await fetch('/api/auth/profile', { credentials: 'include' });
            if (!resp.ok) {
                window.location.replace('/static/login.html');
                return false;
            }
            return true;
        } catch (e) {
            window.location.replace('/static/login.html');
            return false;
        }
    }

    function isValidBarcode(code) {
        if (!code || code.length < 5) return false;
        return /^[A-Za-zА-Яа-я0-9_-]+$/.test(code);
    }

    async function performScan(code) {
        if (!code || code.trim() === '') return;
        code = code.trim();
        if (!isValidBarcode(code)) {
            showError('Некорректный штрих-код. Допустимы только буквы, цифры, дефис и подчёркивание (минимум 5 символов).');
            return;
        }
        showLoading();
        try {
            const resp = await fetch(`/api/mark/${encodeURIComponent(code)}`, { credentials: 'include' });
            if (!resp.ok) {
                let errorMsg = `Ошибка ${resp.status}`;
                try {
                    const err = await resp.json();
                    errorMsg = err.detail || errorMsg;
                } catch(e) {}
                showError(errorMsg);
                return;
            }
            const data = await resp.json();
            renderResults(data);
        } catch (err) {
            showError('Ошибка соединения с сервером');
            console.error(err);
        }
    }

    document.addEventListener('DOMContentLoaded', async function() {
        const ok = await checkAuth();
        if (!ok) return;
        const input = document.getElementById('scanInput');
        input.addEventListener('focus', function() { this.select(); });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const code = this.value.trim();
                if (code) {
                    performScan(code);
                    this.value = '';
                }
            }
        });
        input.addEventListener('input', function() {
            if (!this.value.trim()) {
                document.getElementById('markingDisplay').textContent = '';
                document.getElementById('scanResult').style.display = 'none';
                const placeholder = document.getElementById('placeholderMessage');
                placeholder.style.display = 'flex';
                placeholder.innerHTML = 'Ожидание сканирования...';
            }
        });
        // Начальное состояние
        document.getElementById('scanResult').style.display = 'none';
        document.getElementById('placeholderMessage').style.display = 'flex';
        document.getElementById('placeholderMessage').innerHTML = 'Ожидание сканирования...';
    });
</script>
</body>
</html>
