<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маркировка</title>
    <link rel="icon" type="image/png" href="/static/ttr.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            overflow: hidden; /* страница целиком не скроллится */
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            height: 100%;
            max-height: calc(100vh - 32px);
            background: white;
            border-radius: 32px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            flex: 1;
            min-height: 0;
        }

        .left-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
            min-height: 0;
            padding-top: 12px; /* отступ сверху, чтобы не слетал */
            overflow: hidden;
        }

        .right-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .logo-btn {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #e2e8f0;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            text-decoration: none;
        }
        .logo-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-btn:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        .input-marking-wrapper {
            display: flex;
            align-items: center;
            flex: 1;
            gap: 12px;
            min-width: 0;
        }
        #scanInput {
            flex: 1;
            padding: 12px 18px;
            font-size: 1rem;
            border: 2px solid #3b82f6;
            border-radius: 60px;
            outline: none;
            background: #f8fafc;
            transition: 0.2s;
            min-width: 0;
        }
        #scanInput:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
            background: white;
        }
        #scanInput::placeholder {
            color: #94a3b8;
        }
        #markingDisplay {
            font-weight: bold;
            font-size: 1.1rem;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Карточка товара (название, вид, фандом) - зафиксирована, не скроллится */
        #productInfoContainer {
            flex-shrink: 0;
        }
        .product-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 0;
            width: 100%;
        }
        .product-info .name-line {
            font-size: 1.4rem;
            font-weight: 600;
            color: #0f172a;
            line-height: 1.3;
        }
        .product-info .name-line .code-part {
            font-weight: 700;
            color: #3b82f6;
        }
        .product-info .details-line {
            font-size: 1.1rem;
            color: #334155;
        }
        .product-info .details-line .type-part {
            font-weight: 500;
        }
        .product-info .details-line .fandom-part {
            font-weight: 500;
            color: #475569;
        }

        /* Единственный скроллируемый блок: болванка + таблица маркировок */
        .tables-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px; /* место под скроллбар, чтобы не наезжал на контент */
        }

        .placeholder-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            aspect-ratio: 1 / 1;
            gap: 4px;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 6px;
            flex-shrink: 0;
            max-height: 150px;
        }
        .placeholder-grid .cell {
            background: white;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #94a3b8;
        }

        /* Таблица маркировок больше не скроллится сама - скроллит родитель .tables-scroll */
        .table-container {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 8px;
            background: #fafafa;
            flex-shrink: 0;
        }
        .table-container table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .table-container th {
            background: #f1f5f9;
            padding: 8px 12px;
            text-align: left;
            font-weight: 600;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .table-container td {
            padding: 6px 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        .table-container tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            color: white;
            text-align: center;
            white-space: nowrap;
        }
        .badge-wb {
            background: #6b21a5;
        }
        .badge-oz {
            background: #1e40af;
        }
        .badge-fsk {
            background: #64748b;
        }

        /* Картинка - занимает всю высоту правой колонки, остаётся на месте */
        .image-wrapper {
            flex: 1;
            min-height: 0;
            width: 100%;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .image-wrapper .no-image {
            color: #94a3b8;
            font-size: 1rem;
            text-align: center;
            padding: 20px;
        }

        .no-result { color: #ef4444; text-align: center; padding: 20px 0; font-size: 1.1rem; }
        .loading { text-align: center; color: #64748b; padding: 20px 0; }
        .error {
            color: #ef4444;
            text-align: center;
            padding: 20px;
            background: #fee2e2;
            border-radius: 12px;
        }
        .placeholder-text {
            color: #64748b;
            text-align: center;
            padding: 20px 0;
            width: 100%;
        }

        @media (max-width: 700px) {
            .container { padding: 16px; }
            .main-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .right-col {
                flex: 0 0 140px;
            }
            .logo-btn { width: 40px; height: 40px; }
            #scanInput { font-size: 0.95rem; padding: 10px 14px; }
            #markingDisplay { font-size: 1rem; }
            .product-info .name-line { font-size: 1.2rem; }
            .product-info .details-line { font-size: 1rem; }
            .table-container { font-size: 0.8rem; }
            .table-container td, .table-container th { padding: 4px 8px; }
            .left-col {
                padding-top: 8px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="main-grid">
        <!-- Левая колонка -->
        <div class="left-col">
            <div class="search-row">
                <a href="/static/employee.html" class="logo-btn" title="Личный кабинет">
                    <img src="/static/ttr.png" alt="ЛК">
                </a>
                <div class="input-marking-wrapper">
                    <input type="text" id="scanInput" placeholder="Штрих-код или артикул..." autofocus>
                    <span id="markingDisplay"></span>
                </div>
            </div>
            <!-- Название/вид товара - фиксировано, не скроллится -->
            <div id="productInfoContainer">
                <p class="placeholder-text">Ожидание сканирования...</p>
            </div>
            <!-- Единственный скроллируемый блок: сначала болванка, потом таблица -->
            <div class="tables-scroll" id="tablesScroll"></div>
        </div>

        <!-- Правая колонка -->
        <div class="right-col">
            <div class="image-wrapper" id="imageContainer">
                <div class="no-image" id="noImageLabel">Нет изображения</div>
                <img id="productImage" src="" alt="Товар" style="display:none;">
            </div>
        </div>
    </div>
</div>
<script>
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            return m;
        });
    }
    function showError(message) {
        document.getElementById('productInfoContainer').innerHTML = `<div class="error">❌ ${escapeHtml(message)}</div>`;
        document.getElementById('tablesScroll').innerHTML = '';
        document.getElementById('markingDisplay').textContent = '';
        resetImage();
    }
    function showLoading() {
        document.getElementById('productInfoContainer').innerHTML = '<div class="loading">⏳ Поиск...</div>';
        document.getElementById('tablesScroll').innerHTML = '';
        document.getElementById('markingDisplay').textContent = '⏳';
        resetImage();
    }
    function resetImage() {
        const img = document.getElementById('productImage');
        const noImg = document.getElementById('noImageLabel');
        img.style.display = 'none';
        noImg.style.display = 'flex';
    }

    function renderResults(products) {
        const infoDiv = document.getElementById('productInfoContainer');
        const scrollDiv = document.getElementById('tablesScroll');
        const markingSpan = document.getElementById('markingDisplay');
        const img = document.getElementById('productImage');
        const noImg = document.getElementById('noImageLabel');

        if (!products || products.length === 0) {
            infoDiv.innerHTML = '<div class="no-result">⚠️ Товар не найден</div>';
            scrollDiv.innerHTML = '';
            markingSpan.textContent = '';
            resetImage();
            return;
        }

        const product = products[0];
        const code = product['Код'] || '';
        const type = product['Вид'] || '—';
        const fandom = product['Фандом'] || '—';
        const name = product['Название'] || '—';
        const marking = product['Маркировка'] || '';
        const tableData = product['table'] || [];

        markingSpan.textContent = marking || '';

        const imageUrl = code ? `/static/img/${code}.jpg` : null;

        // Карточка товара - остаётся на месте, не скроллится
        infoDiv.innerHTML = `
            <div class="product-info">
                <div class="name-line">
                    <span class="code-part">${escapeHtml(code)}</span>
                    <span>${escapeHtml(name)}</span>
                </div>
                <div class="details-line">
                    <span class="type-part">${escapeHtml(type)}</span>
                    ${fandom ? `, <span class="fandom-part">${escapeHtml(fandom)}</span>` : ''}
                </div>
            </div>
        `;

        // Болванка + таблица маркировок - идут друг под другом внутри одного скролл-блока
        let scrollHtml = `
            <div class="placeholder-grid">
                <div class="cell">1</div>
                <div class="cell">2</div>
                <div class="cell">3</div>
                <div class="cell">4</div>
                <div class="cell">5</div>
                <div class="cell">6</div>
                <div class="cell">7</div>
                <div class="cell">8</div>
                <div class="cell">9</div>
            </div>
        `;

        if (tableData.length) {
            let tableHtml = `<div class="table-container"><table>
                <thead><tr><th>Маркировка</th><th>ID</th><th>Штрих-код</th></tr></thead><tbody>`;
            for (const row of tableData) {
                let badgeClass = '';
                if (row.platform === 'WB') {
                    badgeClass = 'badge-wb';
                } else if (row.platform === 'OZ') {
                    badgeClass = 'badge-oz';
                } else {
                    badgeClass = 'badge-fsk';
                }
                tableHtml += `<tr>
                    <td><span class="badge ${badgeClass}">${escapeHtml(row.marking)}</span></td>
                    <td>${escapeHtml(row.id)}</td>
                    <td>${escapeHtml(row.bar)}</td>
                </tr>`;
            }
            tableHtml += `</tbody></table></div>`;
            scrollHtml += tableHtml;
        } else {
            scrollHtml += `<div class="table-container"><p style="color:#94a3b8; text-align:center;">Нет данных</p></div>`;
        }

        scrollDiv.innerHTML = scrollHtml;
        scrollDiv.scrollTop = 0; // при новом сканировании показываем скролл-блок с самого верха

        if (imageUrl) {
            img.src = imageUrl;
            img.alt = escapeHtml(name);
            img.style.display = 'block';
            noImg.style.display = 'none';
            img.onerror = function() {
                img.style.display = 'none';
                noImg.style.display = 'flex';
            };
        } else {
            resetImage();
        }
    }

    async function checkAuth() {
        try {
            const resp = await fetch('/api/auth/profile', { credentials: 'include' });
            if (!resp.ok) {
                window.location.replace('/static/login.html');
                return false;
            }
            return true;
        } catch (e) {
            window.location.replace('/static/login.html');
            return false;
        }
    }

    function isValidBarcode(code) {
        if (!code || code.length < 5) return false;
        return /^[A-Za-zА-Яа-я0-9_-]+$/.test(code);
    }

    async function performScan(code) {
        if (!code || code.trim() === '') return;
        code = code.trim();
        if (!isValidBarcode(code)) {
            showError('Некорректный штрих-код. Допустимы только буквы, цифры, дефис и подчёркивание (минимум 5 символов).');
            return;
        }
        showLoading();
        try {
            const resp = await fetch(`/api/mark/${encodeURIComponent(code)}`, { credentials: 'include' });
            if (!resp.ok) {
                let errorMsg = `Ошибка ${resp.status}`;
                try {
                    const err = await resp.json();
                    errorMsg = err.detail || errorMsg;
                } catch(e) {}
                showError(errorMsg);
                return;
            }
            const data = await resp.json();
            renderResults(data);
        } catch (err) {
            showError('Ошибка соединения с сервером');
            console.error(err);
        }
    }

    document.addEventListener('DOMContentLoaded', async function() {
        const ok = await checkAuth();
        if (!ok) return;
        const input = document.getElementById('scanInput');
        input.addEventListener('focus', function() { this.select(); });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const code = this.value.trim();
                if (code) {
                    performScan(code);
                    this.value = '';
                }
            }
        });
        input.addEventListener('input', function() {
            if (!this.value.trim()) {
                document.getElementById('markingDisplay').textContent = '';
                document.getElementById('productInfoContainer').innerHTML = '<p class="placeholder-text">Ожидание сканирования...</p>';
                document.getElementById('tablesScroll').innerHTML = '';
                resetImage();
            }
        });
    });
</script>
</body>
</html>
