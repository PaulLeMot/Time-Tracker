<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маркировка</title>
    <link rel="icon" type="image/png" href="/static/ttr.png">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 32px;
        }
        .scan-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap;
        }
        .logo-btn {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #e2e8f0;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            text-decoration: none;
        }
        .logo-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-btn:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
        #scanInput {
            flex: 1;
            min-width: 0;
            padding: 14px 20px;
            font-size: 1.1rem;
            border: 2px solid #3b82f6;
            border-radius: 60px;
            outline: none;
            background: #f8fafc;
            transition: 0.2s;
        }
        #scanInput:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
            background: white;
        }
        #scanInput::placeholder {
            color: #94a3b8;
        }
        #scanResult {
            margin-top: 24px;
        }

        .product-card {
            display: flex;
            gap: 30px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            align-items: flex-start;
        }
        .product-info {
            flex: 1;
            min-width: 0;
        }
        .product-info h3 {
            margin-top: 0;
            color: #0f172a;
            font-size: 1.3rem;
        }
        .field {
            display: flex;
            padding: 6px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .field:last-child { border-bottom: none; }
        .field-label {
            font-weight: 600;
            color: #334155;
            width: 140px;
            flex-shrink: 0;
        }
        .field-value {
            color: #0f172a;
            word-break: break-word;
        }

        .product-image {
            flex-shrink: 0;
            width: 100%;
            max-width: 350px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .product-image img {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: contain;
        }
        .product-image .no-image {
            color: #94a3b8;
            font-size: 1rem;
            text-align: center;
            padding: 20px;
        }

        .no-result { color: #ef4444; text-align: center; padding: 40px 0; font-size: 1.1rem; }
        .loading { text-align: center; color: #64748b; padding: 40px 0; }
        .error {
            color: #ef4444;
            text-align: center;
            padding: 20px;
            background: #fee2e2;
            border-radius: 12px;
        }

        @media (max-width: 700px) {
            .container { padding: 20px; }
            .product-card {
                flex-direction: column;
                align-items: center;
            }
            .product-image {
                max-width: 100%;
                width: 100%;
                min-height: 200px;
            }
            .field {
                flex-direction: column;
            }
            .field-label { width: 100%; }
            .scan-row {
                flex-wrap: nowrap;
            }
            .logo-btn {
                width: 42px;
                height: 42px;
            }
            #scanInput {
                font-size: 1rem;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="scan-row">
        <a href="/static/employee.html" class="logo-btn" title="Личный кабинет">
            <img src="/static/ttr.png" alt="ЛК">
        </a>
        <input type="text" id="scanInput" placeholder="Отсканируйте штрих-код или введите артикул..." autofocus>
    </div>
    <div id="scanResult"></div>
</div>
<script>
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            return m;
        });
    }
    function showError(message) {
        document.getElementById('scanResult').innerHTML = `<div class="error">❌ ${escapeHtml(message)}</div>`;
    }
    function showLoading() {
        document.getElementById('scanResult').innerHTML = '<div class="loading">⏳ Поиск...</div>';
    }

    function renderResults(products) {
        const resultDiv = document.getElementById('scanResult');
        if (!products || products.length === 0) {
            resultDiv.innerHTML = '<div class="no-result">⚠️ Товар не найден</div>';
            return;
        }
        let html = '';
        for (const product of products) {
            const code = product['Код'] || '';
            const type = product['Вид'] || '—';
            const fandom = product['Фандом'] || '—';
            const name = product['Название'] || '—';
            const marking = product['Маркировка'] || null;

            const imageUrl = code ? `/static/img/${code}.jpg` : null;

            html += `
                <div class="product-card">
                    <div class="product-info">
                        <h3>${escapeHtml(name)}</h3>
                        <div class="field"><span class="field-label">Код</span><span class="field-value">${escapeHtml(code)}</span></div>
                        <div class="field"><span class="field-label">Вид</span><span class="field-value">${escapeHtml(type)}</span></div>
                        <div class="field"><span class="field-label">Фандом</span><span class="field-value">${escapeHtml(fandom)}</span></div>
                        ${marking ? `<div class="field"><span class="field-label">Маркировка</span><span class="field-value">${escapeHtml(marking)}</span></div>` : ''}
                    </div>
                    <div class="product-image">
                        ${imageUrl ? `<img src="${imageUrl}" alt="${escapeHtml(name)}" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'no-image\\'>Нет изображения</div>';">` : '<div class="no-image">Нет изображения</div>'}
                    </div>
                </div>
            `;
        }
        resultDiv.innerHTML = html;
    }

    async function checkAuth() {
        try {
            const resp = await fetch('/api/auth/profile', { credentials: 'include' });
            if (!resp.ok) {
                window.location.replace('/static/login.html');
                return false;
            }
            return true;
        } catch (e) {
            window.location.replace('/static/login.html');
            return false;
        }
    }

    function isValidBarcode(code) {
        if (!code || code.length < 5) return false;
        return /^[A-Za-zА-Яа-я0-9_-]+$/.test(code);
    }

    async function performScan(code) {
        if (!code || code.trim() === '') return;
        code = code.trim();
        if (!isValidBarcode(code)) {
            showError('Некорректный штрих-код. Допустимы только буквы, цифры, дефис и подчёркивание (минимум 5 символов).');
            return;
        }
        showLoading();
        try {
            const resp = await fetch(`/api/mark/${encodeURIComponent(code)}`, { credentials: 'include' });
            if (!resp.ok) {
                let errorMsg = `Ошибка ${resp.status}`;
                try {
                    const err = await resp.json();
                    errorMsg = err.detail || errorMsg;
                } catch(e) {}
                showError(errorMsg);
                return;
            }
            const data = await resp.json();
            renderResults(data);
        } catch (err) {
            showError('Ошибка соединения с сервером');
            console.error(err);
        }
    }

    document.addEventListener('DOMContentLoaded', async function() {
        const ok = await checkAuth();
        if (!ok) return;
        const input = document.getElementById('scanInput');
        input.addEventListener('focus', function() { this.select(); });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const code = this.value.trim();
                if (code) {
                    performScan(code);
                    this.value = '';
                }
            }
        });
    });
</script>
</body>
</html>
