<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в мониторинг</title>
    <link rel="icon" type="image/png" href="/static/ttr.png">
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            width: 300px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
        }
        .error {
            color: red;
            font-size: 0.9rem;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h2>Вход в мониторинг</h2>
    <input type="password" id="password" placeholder="Пароль">
    <button id="loginBtn">Войти</button>
    <div id="error" class="error"></div>
</div>
<script>
    document.getElementById('loginBtn').onclick = async () => {
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error');
        errorDiv.innerText = '';
        try {
            const resp = await fetch('/api/auth/monitor/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password }),
                credentials: 'include'
            });
            if (resp.ok) {
                window.location.replace('/monitor');
            } else {
                const err = await resp.json();
                errorDiv.innerText = err.detail || 'Неверный пароль';
            }
        } catch (err) {
            errorDiv.innerText = 'Ошибка соединения';
        }
    };
</script>
</body>
</html>
