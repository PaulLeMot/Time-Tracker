<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск товаров</title>
    <link rel="icon" type="image/png" href="/static/ttr.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f0f4ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }
        .container {
            max-width: 1300px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            padding: 30px 25px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .back-link {
            background: #f0f4ff;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            color: #1e293b;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
        }
        .back-link:hover { background: #e2e8f0; }
        h2 { font-weight: 700; font-size: 1.8rem; color: #0f172a; }

        .search-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .field {
            position: relative;
            flex: 1 1 180px;
            min-width: 160px;
        }
        .field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        input, select {
            width: 100%;
            padding: 12px 40px 12px 15px;
            font-size: 0.95rem;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            outline: none;
            background: white;
            transition: 0.2s;
            appearance: none;
        }
        input:focus, select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .clear-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #94a3b8;
            padding: 0;
            display: none;
            line-height: 1;
        }
        .clear-btn.visible { display: block; }
        .clear-btn:hover { color: #ef4444; }

        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        .dropdown-list.open { display: block; }
        .dropdown-item {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid #f1f5f9;
        }
        .dropdown-item:hover { background: #f0f7ff; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 1024px) {
            .products-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 768px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .search-panel { flex-direction: column; }
            .field { flex: 1 1 auto; }
        }

        .product-card {
            background: #f8fafc;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.05);
        }
        .product-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: white;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 10px;
        }
        .product-card .code {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 4px;
        }
        .product-card .name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #0f172a;
            line-height: 1.3;
            margin-bottom: 4px;
        }
        .product-card .meta {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .pagination button {
            background: #f0f4ff;
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .pagination button.active {
            background: #3b82f6;
            color: white;
        }
        .pagination button:disabled {
            opacity: 0.4;
            cursor: default;
        }
        .results-info {
            text-align: center;
            color: #64748b;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>🔎</h2>
        <a href="/static/employee.html" class="back-link">← Личный кабинет</a>
    </div>

    <div class="search-panel">
        <div class="field">
            <label>Код товара</label>
            <div class="input-wrapper">
                <input type="text" id="codeInput" placeholder="Введите код или часть">
                <button class="clear-btn" id="clearCode">✕</button>
            </div>
        </div>

        <div class="field">
            <label>Вид товара</label>
            <div class="input-wrapper">
                <select id="typeSelect"><option value="">Все виды</option></select>
                <button class="clear-btn" id="clearType">✕</button>
            </div>
        </div>

        <div class="field">
            <label>Фандом</label>
            <div class="input-wrapper">
                <select id="fandomSelect"><option value="">Все фандомы</option></select>
                <button class="clear-btn" id="clearFandom">✕</button>
            </div>
        </div>
    </div>

    <div class="results-info" id="resultsInfo">Загрузка...</div>
    <div class="products-grid" id="productsGrid"></div>
    <div class="pagination" id="pagination"></div>
</div>

<script>
    // Состояние
    let currentPage = 0;
    const limit = 30;

    // Элементы
    const codeInput = document.getElementById('codeInput');
    const typeSelect = document.getElementById('typeSelect');
    const fandomSelect = document.getElementById('fandomSelect');
    const clearCode = document.getElementById('clearCode');
    const clearType = document.getElementById('clearType');
    const clearFandom = document.getElementById('clearFandom');
    const grid = document.getElementById('productsGrid');
    const info = document.getElementById('resultsInfo');
    const paginationDiv = document.getElementById('pagination');

    // Загрузка фильтров при старте
    async function loadFilterOptions() {
        const resp = await fetch('/api/products/filter-options');
        const data = await resp.json();
        populateSelect(typeSelect, data.product_types);
        populateSelect(fandomSelect, data.fandoms);
    }

    function populateSelect(select, items) {
        const current = select.value;
        select.innerHTML = '<option value="">Все</option>';
        items.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item;
            opt.textContent = item;
            select.appendChild(opt);
        });
        select.value = current;
    }

    // Получение и отрисовка товаров
    async function loadProducts(page = 0) {
        const code = codeInput.value.trim();
        const type = typeSelect.value;
        const fandom = fandomSelect.value;
        const offset = page * limit;

        let url = `/api/products/filtered?limit=${limit}&offset=${offset}`;
        if (code) url += `&code=${encodeURIComponent(code)}`;
        if (type) url += `&product_type=${encodeURIComponent(type)}`;
        if (fandom) url += `&fandom=${encodeURIComponent(fandom)}`;

        const resp = await fetch(url);
        const data = await resp.json();

        // Информация о количестве
        info.textContent = `Найдено товаров: ${data.total}`;

        // Отрисовка сетки
        grid.innerHTML = '';
        if (data.items.length === 0) {
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px;">Ничего не найдено</div>';
            paginationDiv.innerHTML = '';
            return;
        }
        data.items.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${p.image_url}" alt="${p.name}" onerror="this.src='/static/ttr.png'">
                <div class="code">${p.code}</div>
                <div class="name">${escapeHtml(p.name)}</div>
                <div class="meta">${p.product_type} ${p.fandom ? '· '+escapeHtml(p.fandom) : ''}</div>
            `;
            grid.appendChild(card);
        });

        // Пагинация
        renderPagination(data.total, page);
    }

    function renderPagination(total, current) {
        const totalPages = Math.ceil(total / limit);
        paginationDiv.innerHTML = '';
        if (totalPages <= 1) return;

        const maxButtons = 7;
        let start = Math.max(0, current - Math.floor(maxButtons/2));
        let end = Math.min(totalPages, start + maxButtons);
        if (end - start < maxButtons) start = Math.max(0, end - maxButtons);

        // Назад
        const prevBtn = document.createElement('button');
        prevBtn.textContent = '←';
        prevBtn.disabled = current === 0;
        prevBtn.onclick = () => loadProducts(current - 1);
        paginationDiv.appendChild(prevBtn);

        for (let i = start; i < end; i++) {
            const btn = document.createElement('button');
            btn.textContent = i + 1;
            if (i === current) btn.classList.add('active');
            btn.onclick = () => loadProducts(i);
            paginationDiv.appendChild(btn);
        }

        // Вперёд
        const nextBtn = document.createElement('button');
        nextBtn.textContent = '→';
        nextBtn.disabled = current >= totalPages - 1;
        nextBtn.onclick = () => loadProducts(current + 1);
        paginationDiv.appendChild(nextBtn);
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
    }

    // Очистка полей
    function clearAndSearch(input, clearBtn) {
        input.value = '';
        clearBtn.classList.remove('visible');
        loadProducts(0);
    }
    clearCode.onclick = () => clearAndSearch(codeInput, clearCode);
    clearType.onclick = () => {
        typeSelect.value = '';
        clearType.classList.remove('visible');
        loadProducts(0);
    };
    clearFandom.onclick = () => {
        fandomSelect.value = '';
        clearFandom.classList.remove('visible');
        loadProducts(0);
    };

    // Отображение кнопок очистки
    codeInput.addEventListener('input', () => {
        clearCode.classList.toggle('visible', codeInput.value.length > 0);
    });
    typeSelect.addEventListener('change', () => {
        clearType.classList.toggle('visible', typeSelect.value !== '');
        loadProducts(0);
    });
    fandomSelect.addEventListener('change', () => {
        clearFandom.classList.toggle('visible', fandomSelect.value !== '');
        loadProducts(0);
    });

    // Поиск с задержкой для кода
    let searchTimer;
    codeInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => loadProducts(0), 400);
    });

    // Инициализация
    loadFilterOptions().then(() => loadProducts(0));
</script>
</body>
</html>
