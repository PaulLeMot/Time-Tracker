<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск товаров</title>
    <link rel="icon" type="image/png" href="/static/ttr.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: white;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 100%;
            background: white;
            padding: 5px 10px;      /* уменьшенный верхний и боковой отступ */
            min-height: 100vh;
        }

        /* панель поиска */
        .search-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;               /* уменьшенный зазор между строками */
            margin-bottom: 5px;     /* минимальное расстояние до карточек */
            position: sticky;
            top: 5px;               /* фиксированный отступ от верха при прилипании */
            background: white;
            z-index: 100;
            padding: 5px 0;         /* уменьшенные внутренние отступы */
        }

        /* общие поля */
        .field {
            position: relative;
            min-width: 0;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            font-size: 0.95rem;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            outline: none;
            background: white;
            transition: 0.2s;
        }
        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .clear-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #94a3b8;
            padding: 0;
            display: none;
            line-height: 1;
            z-index: 2;
        }
        .clear-btn.visible { display: block; }
        .clear-btn:hover { color: #ef4444; }

        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            margin-top: 5px;
        }
        .dropdown-list.open { display: block; }
        .dropdown-item {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid #f1f5f9;
        }
        .dropdown-item:hover { background: #f0f7ff; }

        /* первая строка */
        .search-row-top {
            display: flex;
            align-items: center;
            width: 100%;
        }
        .logo-btn {
            flex: 0 0 5%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            margin-right: 8px;
        }
        .logo-btn img {
            width: 100%;
            height: auto;
            max-width: 36px;
            min-width: 24px;
        }
        .field-code {
            flex: 0 0 30%;
            min-width: 0;
            margin-right: 8px;
        }
        .field-type {
            flex: 0 0 60%;
            min-width: 0;
        }

        /* вторая строка */
        .search-row-bottom {
            display: flex;
            align-items: center;
            width: 100%;
        }
        .field-fandom {
            flex: 0 0 80%;
            min-width: 0;
            margin-right: 10px;
        }
        .total-count {
            font-size: 1rem;
            font-weight: 600;
            color: #0f172a;
            white-space: nowrap;
            margin-left: auto;
            margin-right: 20px;
        }

        /* сетка товаров */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 1024px) {
            .products-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 768px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .container {
                padding: 5px 5px;   /* ещё меньше на мобильных */
            }
        }

        .product-card {
            background: #ebebeb;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.05);
        }
        .product-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: white;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 10px;
        }
        .product-card .name {
            font-weight: 600;
            font-size: 1.0rem;
            color: #0f172a;
            line-height: 1.3;
            margin-bottom: 4px;
        }
        .product-card .code {
            font-size: 1.2rem;
            color: #475569;
            font-weight: 500;
        }

        .loader {
            text-align: center;
            padding: 20px;
            color: #64748b;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="search-panel">
        <!-- Первая строка: логотип, код, вид товара -->
        <div class="search-row-top">
            <a href="/static/employee.html" class="logo-btn" title="Личный кабинет">
                <img src="/static/ttr.png" alt="ЛК">
            </a>
            <div class="field field-code">
                <div class="input-wrapper">
                    <input type="text" id="codeInput" placeholder="Код">
                    <button class="clear-btn" id="clearCode">✕</button>
                </div>
            </div>
            <div class="field field-type" id="typeField">
                <div class="input-wrapper">
                    <input type="text" id="typeInput" placeholder="Вид товара" autocomplete="off">
                    <button class="clear-btn" id="clearType">✕</button>
                </div>
                <div class="dropdown-list" id="typeDropdown"></div>
            </div>
        </div>

        <!-- Вторая строка: фандом, количество -->
        <div class="search-row-bottom">
            <div class="field field-fandom" id="fandomField">
                <div class="input-wrapper">
                    <input type="text" id="fandomInput" placeholder="Фандом" autocomplete="off">
                    <button class="clear-btn" id="clearFandom">✕</button>
                </div>
                <div class="dropdown-list" id="fandomDropdown"></div>
            </div>
            <span class="total-count" id="totalCount">0</span>
        </div>
    </div>

    <div class="products-grid" id="productsGrid"></div>
    <div class="loader" id="loader">Загрузка...</div>
</div>

<script>
    // Состояние
    const limit = 30;
    let allTypes = [];
    let allFandoms = [];
    let selectedType = '';
    let selectedFandom = '';
    let currentOffset = 0;
    let totalProducts = 0;
    let isLoading = false;
    let hasMore = true;

    // Элементы
    const codeInput = document.getElementById('codeInput');
    const typeInput = document.getElementById('typeInput');
    const fandomInput = document.getElementById('fandomInput');
    const clearCode = document.getElementById('clearCode');
    const clearTypeBtn = document.getElementById('clearType');
    const clearFandomBtn = document.getElementById('clearFandom');
    const grid = document.getElementById('productsGrid');
    const totalCountSpan = document.getElementById('totalCount');
    const typeDropdown = document.getElementById('typeDropdown');
    const fandomDropdown = document.getElementById('fandomDropdown');
    const loader = document.getElementById('loader');

    // Функция обновления видимости крестика
    function updateClearButton(input, btn) {
        btn.classList.toggle('visible', input.value.length > 0);
    }

    // Загрузка фильтров (всех или отфильтрованных)
    async function loadFilterOptions(productType = '', fandom = '') {
        let url = '/api/products/filter-options';
        const params = new URLSearchParams();
        if (productType) params.append('product_type', productType);
        if (fandom) params.append('fandom', fandom);
        if (params.toString()) url += '?' + params.toString();

        const resp = await fetch(url);
        const data = await resp.json();
        return data;
    }

    // Обновление глобальных списков типов/фандомов (без открытия)
    async function updateDropdowns() {
        const data = await loadFilterOptions(selectedType, selectedFandom);
        allTypes = data.product_types;
        allFandoms = data.fandoms;
    }

    // Инициализация фильтров при загрузке
    async function initFilters() {
        await updateDropdowns();
    }

    // Отображение выпадающего списка для конкретного поля
    function showDropdown(input, dropdown, items, onSelect) {
        const query = input.value.trim().toLowerCase();
        const filtered = items.filter(item => item.toLowerCase().includes(query));
        renderDropdownItems(dropdown, filtered, input, onSelect);
        dropdown.classList.add('open');
    }

    function renderDropdownItems(container, items, input, onSelect) {
        container.innerHTML = '';
        if (items.length === 0) {
            container.innerHTML = '<div class="dropdown-item" style="color:#94a3b8">Ничего не найдено</div>';
        } else {
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'dropdown-item';
                div.textContent = item;
                div.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    input.value = item;
                    container.classList.remove('open');
                    updateClearButton(input, input.nextElementSibling);
                    onSelect(item);
                });
                container.appendChild(div);
            });
        }
    }

    function closeAllDropdowns() {
        typeDropdown.classList.remove('open');
        fandomDropdown.classList.remove('open');
    }

    // Обработчики полей
    // Тип товара
    typeInput.addEventListener('input', () => {
        updateClearButton(typeInput, clearTypeBtn);
        showDropdown(typeInput, typeDropdown, allTypes, (value) => {
            selectedType = value;
            typeInput.value = value;
            updateClearButton(typeInput, clearTypeBtn);
            closeAllDropdowns();
            updateDropdowns().then(() => resetAndLoad());
        });
    });
    typeInput.addEventListener('focus', () => {
        showDropdown(typeInput, typeDropdown, allTypes, (value) => {
            selectedType = value;
            typeInput.value = value;
            updateClearButton(typeInput, clearTypeBtn);
            closeAllDropdowns();
            updateDropdowns().then(() => resetAndLoad());
        });
    });

    // Фандом
    fandomInput.addEventListener('input', () => {
        updateClearButton(fandomInput, clearFandomBtn);
        showDropdown(fandomInput, fandomDropdown, allFandoms, (value) => {
            selectedFandom = value;
            fandomInput.value = value;
            updateClearButton(fandomInput, clearFandomBtn);
            closeAllDropdowns();
            updateDropdowns().then(() => resetAndLoad());
        });
    });
    fandomInput.addEventListener('focus', () => {
        showDropdown(fandomInput, fandomDropdown, allFandoms, (value) => {
            selectedFandom = value;
            fandomInput.value = value;
            updateClearButton(fandomInput, clearFandomBtn);
            closeAllDropdowns();
            updateDropdowns().then(() => resetAndLoad());
        });
    });

    // Скрытие выпадашек при клике вне поля
    document.addEventListener('click', (e) => {
        if (!e.target.closest('#typeField')) typeDropdown.classList.remove('open');
        if (!e.target.closest('#fandomField')) fandomDropdown.classList.remove('open');
    });

    // Очистка полей
    function clearField(input, clearBtn, resetCallback) {
        input.value = '';
        clearBtn.classList.remove('visible');
        closeAllDropdowns();
        resetCallback();
        resetAndLoad();
    }

    clearCode.onclick = () => clearField(codeInput, clearCode, () => {});
    clearTypeBtn.onclick = (e) => {
        e.stopPropagation();
        clearField(typeInput, clearTypeBtn, () => {
            selectedType = '';
            updateDropdowns();
        });
    };
    clearFandomBtn.onclick = (e) => {
        e.stopPropagation();
        clearField(fandomInput, clearFandomBtn, () => {
            selectedFandom = '';
            updateDropdowns();
        });
    };

    codeInput.addEventListener('input', () => {
        updateClearButton(codeInput, clearCode);
    });

    // Поиск с задержкой для кода
    let searchTimer;
    codeInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => resetAndLoad(), 400);
    });

    // Сброс и загрузка с начала
    function resetAndLoad() {
        currentOffset = 0;
        hasMore = true;
        grid.innerHTML = '';
        loadProducts();
    }

    // Загрузка товаров (бесконечный скролл)
    async function loadProducts() {
        if (isLoading || !hasMore) return;
        isLoading = true;
        loader.style.display = 'block';

        const code = codeInput.value.trim();
        let url = `/api/products/filtered?limit=${limit}&offset=${currentOffset}`;
        if (code) url += `&code=${encodeURIComponent(code)}`;
        if (selectedType) url += `&product_type=${encodeURIComponent(selectedType)}`;
        if (selectedFandom) url += `&fandom=${encodeURIComponent(selectedFandom)}`;

        const resp = await fetch(url);
        const data = await resp.json();
        totalCountSpan.textContent = data.total;
        totalProducts = data.total;

        if (data.items.length === 0 && currentOffset === 0) {
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px;">Ничего не найдено</div>';
        } else {
            data.items.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${p.image_url}" alt="${p.name}" onerror="this.src='/static/ttr.png'">
                    <div class="name">${escapeHtml(p.name)}</div>
                    <div class="code">${p.code}</div>
                `;
                grid.appendChild(card);
            });
        }

        currentOffset += data.items.length;
        hasMore = currentOffset < totalProducts;
        loader.style.display = hasMore ? 'block' : 'none';
        isLoading = false;
    }

    // Intersection Observer для бесконечного скролла
    const sentinel = document.createElement('div');
    sentinel.id = 'scrollSentinel';
    grid.after(sentinel);

    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && hasMore && !isLoading) {
            loadProducts();
        }
    }, { threshold: 0.1 });
    observer.observe(sentinel);

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
    }

    // Инициализация
    initFilters().then(() => {
        loadProducts();
    });
</script>
</body>
</html>
