<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск товаров</title>
    <link rel="icon" type="image/png" href="/static/ttr.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f0f4ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }
        .container {
            max-width: 1300px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            padding: 30px 25px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .back-link {
            background: #f0f4ff;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            color: #1e293b;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
        }
        .back-link:hover { background: #e2e8f0; }
        h2 {
            font-weight: 700;
            font-size: 1.8rem;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: flex-start;
            position: sticky;
            top: 0;
            background: white;
            z-index: 100;
            padding: 10px 0;
            border-radius: 32px 32px 0 0;
        }
        .field {
            position: relative;
            flex: 1 1 180px;
            min-width: 160px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            font-size: 0.95rem;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            outline: none;
            background: white;
            transition: 0.2s;
        }
        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .clear-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #94a3b8;
            padding: 0;
            display: none;
            line-height: 1;
            z-index: 2;
        }
        .clear-btn.visible { display: block; }
        .clear-btn:hover { color: #ef4444; }

        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            margin-top: 5px;
        }
        .dropdown-list.open { display: block; }
        .dropdown-item {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid #f1f5f9;
        }
        .dropdown-item:hover { background: #f0f7ff; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 1024px) {
            .products-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 768px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .search-panel { flex-direction: column; }
            .field { flex: 1 1 auto; }
        }

        .product-card {
            background: #f8fafc;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.05);
        }
        .product-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: white;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 10px;
        }
        .product-card .name {
            font-weight: 600;
            font-size: 0.6rem;
            color: #0f172a;
            line-height: 1.3;
            margin-bottom: 4px;
        }
        .product-card .code {
            font-size: 0.6rem;
            color: #0f172a;
            font-weight: 500;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .pagination button {
            background: #f0f4ff;
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .pagination button.active {
            background: #3b82f6;
            color: white;
        }
        .pagination button:disabled {
            opacity: 0.4;
            cursor: default;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>🔎 <span id="totalCount">0</span></h2>
        <a href="/static/employee.html" class="back-link">← Личный кабинет</a>
    </div>

    <div class="search-panel">
        <div class="field">
            <div class="input-wrapper">
                <input type="text" id="codeInput" placeholder="Код товара">
                <button class="clear-btn" id="clearCode">✕</button>
            </div>
        </div>

        <div class="field" id="typeField">
            <div class="input-wrapper">
                <input type="text" id="typeInput" placeholder="Вид товара" autocomplete="off">
                <button class="clear-btn" id="clearType">✕</button>
            </div>
            <div class="dropdown-list" id="typeDropdown"></div>
        </div>

        <div class="field" id="fandomField">
            <div class="input-wrapper">
                <input type="text" id="fandomInput" placeholder="Фандом" autocomplete="off">
                <button class="clear-btn" id="clearFandom">✕</button>
            </div>
            <div class="dropdown-list" id="fandomDropdown"></div>
        </div>
    </div>

    <div class="products-grid" id="productsGrid"></div>
    <div class="pagination" id="pagination"></div>
</div>

<script>
    // Состояние
    let currentPage = 0;
    const limit = 30;
    let allTypes = [];
    let allFandoms = [];
    let selectedType = '';
    let selectedFandom = '';

    // Элементы
    const codeInput = document.getElementById('codeInput');
    const typeInput = document.getElementById('typeInput');
    const fandomInput = document.getElementById('fandomInput');
    const clearCode = document.getElementById('clearCode');
    const clearTypeBtn = document.getElementById('clearType');
    const clearFandomBtn = document.getElementById('clearFandom');
    const grid = document.getElementById('productsGrid');
    const totalCountSpan = document.getElementById('totalCount');
    const paginationDiv = document.getElementById('pagination');
    const typeDropdown = document.getElementById('typeDropdown');
    const fandomDropdown = document.getElementById('fandomDropdown');

    // Функция обновления видимости крестика
    function updateClearButton(input, btn) {
        btn.classList.toggle('visible', input.value.length > 0);
    }

    // Загрузка фильтров
    async function loadFilterOptions() {
        const resp = await fetch('/api/products/filter-options');
        const data = await resp.json();
        allTypes = data.product_types;
        allFandoms = data.fandoms;
    }

    // Фильтрация и отображение выпадающего списка
    function filterAndShowDropdown(input, dropdown, items, onSelect) {
        const query = input.value.trim().toLowerCase();
        const filtered = items.filter(item => item.toLowerCase().includes(query));
        renderDropdownItems(dropdown, filtered, input, onSelect);
        dropdown.classList.add('open');
    }

    function renderDropdownItems(container, items, input, onSelect) {
        container.innerHTML = '';
        if (items.length === 0) {
            container.innerHTML = '<div class="dropdown-item" style="color:#94a3b8">Ничего не найдено</div>';
        } else {
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'dropdown-item';
                div.textContent = item;
                div.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    input.value = item;
                    container.classList.remove('open');
                    updateClearButton(input, input.nextElementSibling); // показать крестик
                    onSelect(item);
                });
                container.appendChild(div);
            });
        }
    }

    function closeAllDropdowns() {
        typeDropdown.classList.remove('open');
        fandomDropdown.classList.remove('open');
    }

    // Обработчики для поля "Вид товара"
    typeInput.addEventListener('input', () => {
        updateClearButton(typeInput, clearTypeBtn);
        filterAndShowDropdown(typeInput, typeDropdown, allTypes, (value) => {
            selectedType = value;
            loadProducts(0);
        });
    });
    typeInput.addEventListener('focus', () => {
        if (!typeDropdown.classList.contains('open')) {
            filterAndShowDropdown(typeInput, typeDropdown, allTypes, (value) => {
                selectedType = value;
                loadProducts(0);
            });
        }
    });

    // Обработчики для поля "Фандом"
    fandomInput.addEventListener('input', () => {
        updateClearButton(fandomInput, clearFandomBtn);
        filterAndShowDropdown(fandomInput, fandomDropdown, allFandoms, (value) => {
            selectedFandom = value;
            loadProducts(0);
        });
    });
    fandomInput.addEventListener('focus', () => {
        if (!fandomDropdown.classList.contains('open')) {
            filterAndShowDropdown(fandomInput, fandomDropdown, allFandoms, (value) => {
                selectedFandom = value;
                loadProducts(0);
            });
        }
    });

    // Скрытие выпадающих списков при клике вне поля
    document.addEventListener('click', (e) => {
        if (!e.target.closest('#typeField')) typeDropdown.classList.remove('open');
        if (!e.target.closest('#fandomField')) fandomDropdown.classList.remove('open');
    });

    // Очистка полей
    function clearField(input, clearBtn, resetCallback) {
        input.value = '';
        clearBtn.classList.remove('visible');
        closeAllDropdowns();
        resetCallback();
        loadProducts(0);
    }

    clearCode.onclick = () => clearField(codeInput, clearCode, () => {});
    clearTypeBtn.onclick = (e) => {
        e.stopPropagation();
        clearField(typeInput, clearTypeBtn, () => { selectedType = ''; });
    };
    clearFandomBtn.onclick = (e) => {
        e.stopPropagation();
        clearField(fandomInput, clearFandomBtn, () => { selectedFandom = ''; });
    };

    // Для поля кода
    codeInput.addEventListener('input', () => {
        updateClearButton(codeInput, clearCode);
    });
    // Поиск с задержкой для кода
    let searchTimer;
    codeInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => loadProducts(0), 400);
    });

    // Загрузка товаров
    async function loadProducts(page = 0) {
        const code = codeInput.value.trim();
        const offset = page * limit;

        let url = `/api/products/filtered?limit=${limit}&offset=${offset}`;
        if (code) url += `&code=${encodeURIComponent(code)}`;
        if (selectedType) url += `&product_type=${encodeURIComponent(selectedType)}`;
        if (selectedFandom) url += `&fandom=${encodeURIComponent(selectedFandom)}`;

        const resp = await fetch(url);
        const data = await resp.json();
        totalCountSpan.textContent = data.total;

        grid.innerHTML = '';
        if (data.items.length === 0) {
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px;">Ничего не найдено</div>';
            paginationDiv.innerHTML = '';
            return;
        }

        data.items.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${p.image_url}" alt="${p.name}" onerror="this.src='/static/ttr.png'">
                <div class="name">${escapeHtml(p.name)}</div>
                <div class="code">${p.code}</div>
            `;
            grid.appendChild(card);
        });

        renderPagination(data.total, page);
    }

    function renderPagination(total, current) {
        const totalPages = Math.ceil(total / limit);
        paginationDiv.innerHTML = '';
        if (totalPages <= 1) return;

        const maxButtons = 7;
        let start = Math.max(0, current - Math.floor(maxButtons/2));
        let end = Math.min(totalPages, start + maxButtons);
        if (end - start < maxButtons) start = Math.max(0, end - maxButtons);

        const prevBtn = document.createElement('button');
        prevBtn.textContent = '←';
        prevBtn.disabled = current === 0;
        prevBtn.onclick = () => loadProducts(current - 1);
        paginationDiv.appendChild(prevBtn);

        for (let i = start; i < end; i++) {
            const btn = document.createElement('button');
            btn.textContent = i + 1;
            if (i === current) btn.classList.add('active');
            btn.onclick = () => loadProducts(i);
            paginationDiv.appendChild(btn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.textContent = '→';
        nextBtn.disabled = current >= totalPages - 1;
        nextBtn.onclick = () => loadProducts(current + 1);
        paginationDiv.appendChild(nextBtn);
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
    }

    // Инициализация
    loadFilterOptions().then(() => loadProducts(0));
</script>
</body>
</html>
