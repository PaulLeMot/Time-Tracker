<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск товаров</title>
    <link rel="icon" type="image/png" href="/static/ttr.png">
    <link rel="stylesheet" href="/static/camera-scanner.css?v=1.1.5&build=20261103-square">
    <link rel="stylesheet" href="/static/visual-search.css?v=0.3.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: white;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 100%;
            background: white;
            padding: 0 10px;
            min-height: 100vh;
        }

        .search-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 5px;
            position: sticky;
            top: 0;
            background: white;
            z-index: 100;
            padding: 5px 0 0 0;
        }

        .field {
            position: relative;
            min-width: 0;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            font-size: 0.95rem;
            border: 2px solid #e2e8f0;
            border-radius: 40px;
            outline: none;
            background: white;
            transition: 0.2s;
        }
        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        .clear-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #94a3b8;
            padding: 0;
            display: none;
            line-height: 1;
            z-index: 2;
            transition: color 0.2s;
        }
        .clear-btn.visible { display: block; }
        .clear-btn:hover { color: #ef4444; }

        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            margin-top: 5px;
        }
        .dropdown-list.open { display: block; }
        .dropdown-item {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid #f1f5f9;
        }
        .dropdown-item:hover { background: #f0f7ff; }

        .search-row-top {
            display: flex;
            align-items: center;
            width: 100%;
        }

        /* ===== ТОЧНО ТАКИЕ ЖЕ СТИЛИ, КАК В mark.html ===== */
        .logo-btn {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #e2e8f0;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            text-decoration: none;
            margin-right: 8px; /* добавил отступ, как в mark */
        }
        .logo-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-btn:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        .field-code {
            flex: 0 0 30%;
            min-width: 0;
            margin-right: 8px;
        }
        .field-type {
            flex: 0 0 60%;
            min-width: 0;
        }

        .search-row-bottom {
            display: flex;
            align-items: center;
            width: 100%;
        }
        .field-fandom {
            flex: 0 0 80%;
            min-width: 0;
            margin-right: 10px;
        }
        .total-count {
            font-size: 1rem;
            font-weight: 600;
            color: #0f172a;
            white-space: nowrap;
            margin-left: auto;
            margin-right: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 1024px) {
            .products-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 768px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .container { padding: 0 5px; }
            .logo-btn { width: 42px; height: 42px; }
        }

        .product-card {
            background: #ebebeb;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.05);
        }
        .product-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: white;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 10px;
        }
        .product-card .name {
            font-weight: 600;
            font-size: 1.0rem;
            color: #0f172a;
            line-height: 1.3;
            margin-bottom: 4px;
        }
        .product-card .code {
            font-size: 1.2rem;
            color: #475569;
            font-weight: 500;
        }

        .loader {
            text-align: center;
            padding: 20px;
            color: #64748b;
            display: none;
        }
    </style>
</head>
<body class="tt-camera-search">
<div class="container">
    <div class="search-panel">
        <div class="search-row-top">
            <a href="/static/employee.html" class="logo-btn" title="Личный кабинет">
                <img src="/static/ttr.png" alt="ЛК">
            </a>
            <span class="total-count" id="totalCount" aria-label="Количество товаров по текущим фильтрам">Σ 0</span>
            <div class="field field-code">
                <div class="input-wrapper">
                    <input type="text" id="codeInput" placeholder="Код">
                    <button class="clear-btn" id="clearCode">✕</button>
                </div>
            </div>
            <button type="button" id="photoSearchBtn" hidden aria-label="Поиск товара по фотографии рисунка"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h5l2-3h4l2 3h5v14H3z"/><circle cx="12" cy="12" r="4"/></svg></button>
            <button type="button" id="cameraSearchBtn" class="tt-camera-trigger tt-barcode-button" aria-label="Сканировать штрихкод камерой"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4v16M6 4v16M10 4v16M12 4v16M16 4v16M20 4v16"/></svg></button>

        </div>

        <div class="search-row-bottom">
            <div class="field field-type" id="typeField">
                <div class="input-wrapper">
                    <input type="text" id="typeInput" placeholder="Вид товара" autocomplete="off">
                    <button class="clear-btn" id="clearType">✕</button>
                </div>
                <div class="dropdown-list" id="typeDropdown"></div>
            </div>
            <div class="field field-fandom" id="fandomField">
                <div class="input-wrapper">
                    <input type="text" id="fandomInput" placeholder="Фандом" autocomplete="off">
                    <button class="clear-btn" id="clearFandom">✕</button>
                </div>
                <div class="dropdown-list" id="fandomDropdown"></div>
            </div>

        </div>
    </div>

    <div id="cameraSearchNotice" class="tt-camera-notice" role="status" aria-live="polite"></div>

    <div class="products-grid" id="productsGrid"></div>
    <div class="loader" id="loader">Загрузка...</div>
</div>

<script src="/static/camera-engine.js?v=1.1.0&build=20261102b"></script>
<script src="/static/camera-scanner.js?v=1.1.5&build=20261103-square"></script>
<script src="/static/camera-code-search.js?v=1.1.0&build=20261102b"></script>
<script src="/static/visual-search.js?v=0.3.0"></script>
<script>
    // (Ваш существующий JS без изменений)
    const limit = 30;
    let allTypes = [];
    let allFandoms = [];
    let selectedType = '';
    let selectedFandom = '';
    let currentOffset = 0;
    let totalProducts = 0;
    let isLoading = false;
    let hasMore = true;
    let photoSearchActive = false;
    let photoResumePagination = false;
    let searchGeneration = 0;
    let loadController = null;
    let cameraController = null;
    let exactCameraProduct = null;
    let cameraResolving = false;
    let optionsGeneration = 0;
    let optionsController = null;

    const codeInput = document.getElementById('codeInput');
    const typeInput = document.getElementById('typeInput');
    const fandomInput = document.getElementById('fandomInput');
    const clearCode = document.getElementById('clearCode');
    const clearTypeBtn = document.getElementById('clearType');
    const clearFandomBtn = document.getElementById('clearFandom');
    const grid = document.getElementById('productsGrid');
    const totalCountSpan = document.getElementById('totalCount');
    const typeDropdown = document.getElementById('typeDropdown');
    const fandomDropdown = document.getElementById('fandomDropdown');
    const loader = document.getElementById('loader');

    function updateClearButton(input, btn) {
        btn.classList.toggle('visible', input.value.length > 0);
    }

    async function loadFilterOptions(productType = '', fandom = '', signal) {
        let url = '/api/products/filter-options';
        const params = new URLSearchParams();
        if (productType) params.append('product_type', productType);
        if (fandom) params.append('fandom', fandom);
        if (params.toString()) url += '?' + params.toString();
        const resp = await fetch(url, {signal});
        if (!resp.ok) throw new Error('Не удалось обновить варианты фильтров. Товары загружаются независимо.');
        return await resp.json();
    }

    async function updateDropdowns() {
        const generation = ++optionsGeneration;
        optionsController?.abort();
        const controller = optionsController = new AbortController();
        try {
            const data = await loadFilterOptions(selectedType, selectedFandom, controller.signal);
            if (generation !== optionsGeneration) return;
            allTypes = data.product_types;
            allFandoms = data.fandoms;
        } catch (error) {
            if (generation === optionsGeneration && error.name !== 'AbortError' && !cameraResolving) {
                cameraNotice('Не удалось обновить варианты фильтров. Товары загружаются независимо.');
            }
        }
    }

    async function initFilters() {
        await updateDropdowns();
    }

    function showDropdown(input, dropdown, items, onSelect) {
        const query = input.value.trim().toLowerCase();
        const filtered = items.filter(item => item.toLowerCase().includes(query));
        renderDropdownItems(dropdown, filtered, input, onSelect);
        dropdown.classList.add('open');
    }

    function renderDropdownItems(container, items, input, onSelect) {
        container.innerHTML = '';
        if (items.length === 0) {
            container.innerHTML = '<div class="dropdown-item" style="color:#94a3b8">Ничего не найдено</div>';
        } else {
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'dropdown-item';
                div.textContent = item;
                div.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    input.value = item;
                    container.classList.remove('open');
                    updateClearButton(input, input.nextElementSibling);
                    onSelect(item);
                });
                container.appendChild(div);
            });
        }
    }

    function closeAllDropdowns() {
        typeDropdown.classList.remove('open');
        fandomDropdown.classList.remove('open');
    }

    typeInput.addEventListener('input', () => {
        updateClearButton(typeInput, clearTypeBtn);
        showDropdown(typeInput, typeDropdown, allTypes, (value) => {
            selectedType = value;
            typeInput.value = value;
            updateClearButton(typeInput, clearTypeBtn);
            closeAllDropdowns();
            resetAndLoad(); updateDropdowns();
        });
    });
    typeInput.addEventListener('focus', () => {
        showDropdown(typeInput, typeDropdown, allTypes, (value) => {
            selectedType = value;
            typeInput.value = value;
            updateClearButton(typeInput, clearTypeBtn);
            closeAllDropdowns();
            resetAndLoad(); updateDropdowns();
        });
    });

    fandomInput.addEventListener('input', () => {
        updateClearButton(fandomInput, clearFandomBtn);
        showDropdown(fandomInput, fandomDropdown, allFandoms, (value) => {
            selectedFandom = value;
            fandomInput.value = value;
            updateClearButton(fandomInput, clearFandomBtn);
            closeAllDropdowns();
            resetAndLoad(); updateDropdowns();
        });
    });
    fandomInput.addEventListener('focus', () => {
        showDropdown(fandomInput, fandomDropdown, allFandoms, (value) => {
            selectedFandom = value;
            fandomInput.value = value;
            updateClearButton(fandomInput, clearFandomBtn);
            closeAllDropdowns();
            resetAndLoad(); updateDropdowns();
        });
    });

    document.addEventListener('click', (e) => {
        if (!e.target.closest('#typeField')) typeDropdown.classList.remove('open');
        if (!e.target.closest('#fandomField')) fandomDropdown.classList.remove('open');
    });

    function clearField(input, clearBtn, resetCallback) {
        input.value = '';
        clearBtn.classList.remove('visible');
        closeAllDropdowns();
        resetCallback();
        resetAndLoad();
    }

    clearCode.onclick = () => clearField(codeInput, clearCode, () => { exactCameraProduct = null; });
    clearTypeBtn.onclick = (e) => {
        e.stopPropagation();
        clearField(typeInput, clearTypeBtn, () => {
            selectedType = '';
            updateDropdowns();
        });
    };
    clearFandomBtn.onclick = (e) => {
        e.stopPropagation();
        clearField(fandomInput, clearFandomBtn, () => {
            selectedFandom = '';
            updateDropdowns();
        });
    };

    codeInput.addEventListener('input', () => {
        updateClearButton(codeInput, clearCode);
        exactCameraProduct = null;
        invalidateRequests();
        cameraNotice();
    });

    let searchTimer;
    codeInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => resetAndLoad(), 400);
    });
    codeInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); clearTimeout(searchTimer); resetAndLoad(); }
    });

    function invalidateRequests() {
        window.dispatchEvent(new Event('tt-search-change'));
        searchGeneration++;
        loadController?.abort(); cameraController?.abort();
        isLoading = false; cameraResolving = false;
        hasMore = false;
        loader.style.display = 'none';
    }

    function cameraNotice(message = '', action) {
        const notice = document.getElementById('cameraSearchNotice');
        notice.replaceChildren();
        notice.textContent = message;
        if (action) {
            const button = document.createElement('button'); button.type = 'button';
            button.textContent = 'Снять мешающие фильтры'; button.onclick = action; notice.append(button);
        }
    }

    const cameraButton = document.getElementById('cameraSearchBtn');
    const imageScanner = window.TTCamera?.create();
    let resumeOnPageShow = false;
    window.addEventListener('pagehide', () => {
        resumeOnPageShow = hasMore;
        imageScanner?.close('pagehide'); invalidateRequests();
        optionsGeneration++; optionsController?.abort();
        cancelAnimationFrame(nearEndFrame); nearEndFrame = 0;
    });
    window.addEventListener('pageshow', event => {
        if (event.persisted) { hasMore = resumeOnPageShow; scheduleNearEndLoad(); }
    });
    cameraButton.onclick = () => {
        if (!imageScanner || !window.TTCodeSearch) { cameraNotice('Сканер не загрузился. Обновите страницу или введите код вручную.'); return; }
        closeAllDropdowns();
        imageScanner.open({returnFocusTo: cameraButton, onError: message => cameraNotice(message), onDecoded: findCameraImage});
    };

    async function findCameraImage(decoded) {
        clearTimeout(searchTimer);
        const resumePagination = hasMore;
        invalidateRequests();
        const generation = searchGeneration;
        const controller = cameraController = new AbortController();
        cameraResolving = true;
        const textMode = decoded.format === 'OCR_TEXT';
        cameraNotice(textMode ? 'Текст прочитан. Проверяю артикул…' : 'Штрихкод считан. Поиск товара…');
        try {
            const items = textMode ? await TTCodeSearch.resolveText(decoded.rawValue, {signal: controller.signal})
                : await TTCodeSearch.resolveImage(decoded, {signal: controller.signal});
            if (generation !== searchGeneration) return;
            const item = await TTCodeSearch.choose(items, cameraButton, controller.signal, {confirm: textMode});
            if (generation !== searchGeneration) return;
            if (!item) { cameraNotice(items.length ? 'Выбор отменён. Предыдущий поиск сохранён.' :
                textMode ? 'Товар по прочитанному артикулу не найден. Наведите на артикул ещё раз или введите его вручную.' :
                    'Товар по этому штрихкоду не найден. Проверьте таблицу сопоставлений или введите код вручную.'); return; }
            const product = item.product || await TTCodeSearch.request('/api/products/' + encodeURIComponent(item.code), {signal: controller.signal});
            if (generation !== searchGeneration) return;
            if (!product) { cameraNotice('Соответствие найдено, но изображения товара нет в каталоге.'); return; }
            exactCameraProduct = product;
            codeInput.value = product.code; updateClearButton(codeInput, clearCode);
            cameraNotice(); resetAndLoad();
        } catch (error) {
            if (generation === searchGeneration && error.name !== 'AbortError') cameraNotice(error.message);
        } finally {
            if (generation === searchGeneration) {
                cameraResolving = false; loader.style.display = 'none';
                hasMore = resumePagination;
                scheduleNearEndLoad();
            }
        }
    }

    function resetAndLoad() {
        clearTimeout(searchTimer);
        invalidateRequests();
        cameraNotice();
        currentOffset = 0;
        hasMore = true;
        grid.innerHTML = '';
        loadProducts();
    }

    async function loadProducts() {
        if (isLoading || !hasMore || cameraResolving || photoSearchActive) return;
        isLoading = true;
        loader.style.display = 'block';
        const generation = searchGeneration;
        const controller = loadController = new AbortController();

        const code = codeInput.value.trim();
        let url = `/api/products/filtered?limit=${limit}&offset=${currentOffset}`;
        if (code) url += `&code=${encodeURIComponent(code)}`;
        if (selectedType) url += `&product_type=${encodeURIComponent(selectedType)}`;
        if (selectedFandom) url += `&fandom=${encodeURIComponent(selectedFandom)}`;

        try {
        let data;
        if (exactCameraProduct) {
            const p = exactCameraProduct;
            const hiddenType = selectedType && selectedType !== p.product_type;
            const hiddenFandom = selectedFandom && selectedFandom !== p.fandom;
            data = {items: hiddenType || hiddenFandom ? [] : [p], total: hiddenType || hiddenFandom ? 0 : 1};
            if (hiddenType || hiddenFandom) cameraNotice('Товар найден, но скрыт фильтром: ' + [hiddenType ? 'вид товара' : '', hiddenFandom ? 'фандом' : ''].filter(Boolean).join(', ') + '.', () => {
                if (hiddenType) { selectedType = ''; typeInput.value = ''; updateClearButton(typeInput, clearTypeBtn); }
                if (hiddenFandom) { selectedFandom = ''; fandomInput.value = ''; updateClearButton(fandomInput, clearFandomBtn); }
                updateDropdowns(); cameraNotice(); resetAndLoad();
            });
            else cameraNotice('Найден товар по точному коду ' + p.code + '.');
        } else {
            const resp = await fetch(url, {signal: controller.signal});
            if (!resp.ok) throw new Error('Не удалось загрузить товары. Повторите поиск.');
            data = await resp.json();
        }
        if (generation !== searchGeneration) return;
        totalCountSpan.textContent = 'Σ ' + data.total;
        grid.classList.remove('tt-single-product');
        totalProducts = data.total;

        if (data.items.length === 0 && currentOffset === 0) {
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px;">' + (exactCameraProduct ? 'Товар скрыт фильтром' : 'Ничего не найдено') + '</div>';
        } else {
            const fragment = document.createDocumentFragment();
            data.items.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                const image = document.createElement('img');
                image.loading = currentOffset + fragment.childElementCount < 6 ? 'eager' : 'lazy';
                image.decoding = 'async';
                image.src = data.total === 1 ? '/api/visual-search/image500/' + encodeURIComponent(p.code) : p.image_url; image.alt = p.name;
                image.onerror = () => { image.onerror = () => { image.onerror = null; image.src = '/static/ttr.png'; }; image.src = p.image_url; image.dataset.quality = '250-fallback'; };
                const name = document.createElement('div'); name.className = 'name'; name.textContent = p.name;
                const codeLabel = document.createElement('div'); codeLabel.className = 'code'; codeLabel.textContent = p.code;
                card.append(image, name, codeLabel);
                fragment.appendChild(card);
            });
            grid.appendChild(fragment);
        }

        currentOffset += data.items.length;
        hasMore = data.items.length > 0 && currentOffset < totalProducts;
        loader.style.display = hasMore ? 'block' : 'none';
        } catch (error) {
            if (generation === searchGeneration && error.name !== 'AbortError') {
                cameraNotice(error.message); hasMore = false;
                const retry = document.createElement('button'); retry.type = 'button';
                retry.textContent = 'Повторить загрузку';
                retry.onclick = () => { if (generation !== searchGeneration) return; cameraNotice(); hasMore = true; loadProducts(); };
                document.getElementById('cameraSearchNotice').append(retry);
            }
        } finally {
            if (generation === searchGeneration) {
                isLoading = false; loader.style.display = 'none';
                scheduleNearEndLoad();
            }
        }
    }

    const sentinel = document.createElement('div');
    sentinel.id = 'scrollSentinel';
    sentinel.style.height = '1px';
    grid.after(sentinel);

    // Start the next small page before the user reaches the final visible row.
    const prefetchDistance = Math.max(600, Math.min(window.innerHeight * 2, 1600));
    let nearEndFrame = 0;
    function scheduleNearEndLoad() {
        if (nearEndFrame) return;
        nearEndFrame = requestAnimationFrame(() => {
            nearEndFrame = 0;
            if (isLoading || !hasMore || cameraResolving || photoSearchActive) return;
            const bounds = sentinel.getBoundingClientRect();
            if (bounds.top <= window.innerHeight + prefetchDistance && bounds.bottom >= 0) loadProducts();
        });
    }
    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && hasMore && !isLoading) {
            loadProducts();
        }
    }, { rootMargin: `${prefetchDistance}px 0px`, threshold: 0 });
    observer.observe(sentinel);
    window.addEventListener('scroll', scheduleNearEndLoad, {passive: true});
    window.addEventListener('resize', scheduleNearEndLoad, {passive: true});

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
    }

    window.TTVisualSearch?.create({
        button: document.getElementById('photoSearchBtn'),
        barcodeButton: cameraButton, selectedType: () => selectedType,
        beforeOpen: () => {
            imageScanner?.close('mode'); closeAllDropdowns(); clearTimeout(searchTimer);
            photoResumePagination = hasMore; invalidateRequests(); photoSearchActive = true;
        },
        onClose: () => {
            photoSearchActive = false; hasMore = photoResumePagination; scheduleNearEndLoad();
        }
    });

    initFilters();
    loadProducts();
</script>
</body>
</html>
