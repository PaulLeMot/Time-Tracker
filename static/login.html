<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход сотрудника</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: white;
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 { margin-top: 0; color: #0f172a; }
        input { width: 100%; padding: 12px; margin: 8px 0 16px; border: 1px solid #cbd5e1; border-radius: 20px; font-size: 1rem; }
        button { width: 100%; background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 40px; font-size: 1rem; cursor: pointer; }
        .error { color: #dc2626; margin-top: 12px; font-size: 0.9rem; }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            display: inline-block;
            background: #e2e8f0;
            color: #1e293b;
            padding: 8px 16px;
            border-radius: 40px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link a:hover {
            background: #cbd5e1;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h1>Вход в систему</h1>
    <form id="loginForm">
        <label>ФИО сотрудника</label>
        <input type="text" id="fullName" required>
        <label>Пароль</label>
        <input type="password" id="password" required>
        <button type="submit">Войти</button>
        <div id="errorMessage" class="error"></div>
    </form>
    <div class="back-link">
        <a href="/static/scan.html">← Назад к сканеру</a>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('loginForm');
        const errorDiv = document.getElementById('errorMessage');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const password = document.getElementById('password').value;
            errorDiv.innerText = '';
            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name: fullName, password: password })
                });
                if (resp.ok) {
                    window.location.href = '/static/employee.html';
                } else {
                    const err = await resp.json();
                    errorDiv.innerText = err.detail || 'Ошибка входа';
                }
            } catch (err) {
                errorDiv.innerText = 'Ошибка соединения с сервером';
            }
        });
    });
</script>
</body>
</html>
